<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rugs Creation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>:root{--ink:#2b2b2b;--mut:#595959;--line:#dcdcdc;--soft:#f4f4f4;--bg:#fff;--or:#FF5001;--ort:#b93c00;--sel:#ffe9dd;--blk:#0a0a0a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ort);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;left:-9999px}
#app{height:100%;display:flex;flex-direction:column}
/* header */
#top{height:52px;flex:none;background:var(--blk);border-bottom:3px solid var(--or);display:flex;align-items:center;gap:20px;padding:0 16px;color:#fff}
#brand{font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
#burger{display:none;background:none;border:0;color:#fff;padding:6px}
#sbox{flex:0 1 620px;position:relative}
#sbox label{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;background:#fff;border-radius:6px;color:var(--mut)}
#q{flex:1;border:0;outline:0;background:transparent;color:var(--ink);min-width:0}
#sbox:focus-within label{box-shadow:0 0 0 2px var(--or)}
#chips{position:absolute;top:38px;left:0;right:0;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px;display:none;gap:6px;flex-wrap:wrap;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#sbox:focus-within #chips{display:flex}
.chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;font-size:12.5px}
.chip:hover{background:var(--sel)}
#topr{margin-left:auto;display:flex;align-items:center;gap:6px}
.tb{background:none;border:0;color:#fff;border-radius:6px;padding:7px;display:grid;place-items:center}
.tb:hover{background:#2a2a2a}
#acct{width:32px;height:32px;border-radius:50%;background:var(--or);color:#0a0a0a;font-weight:700;font-size:12.5px;border:0}
/* tabs + ribbon */
#tabs{flex:none;display:flex;background:var(--soft);padding:0 12px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:0 16px;height:36px;font-size:13.5px}
.tab.on{font-weight:600;color:var(--ort);box-shadow:inset 0 -3px 0 var(--or)}
#ribbon{flex:none;height:88px;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;overflow-y:hidden;background:#fff;scrollbar-width:thin}
.pane{display:none;height:100%}
.pane.on{display:flex}
.grp{display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:6px 10px 4px;border-right:1px solid var(--line);flex:none}
.grp>div{display:flex;gap:2px}
.gl{font-size:11.5px;color:var(--mut)}
.rb{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 8px;border:0;background:none;border-radius:6px;font-size:12.5px;min-width:54px;white-space:nowrap}
.rb:hover{background:var(--soft)}
.rb.pri{background:var(--ort);color:#fff;min-width:68px}
.rb.pri:hover{background:#9d3300}
.rb.on{background:var(--sel)}
.rb[disabled]{opacity:.45;cursor:default}
/* main */
#main{flex:1;min-height:0;display:flex}
#nav{flex:none;width:var(--navw,236px);background:#fafafa;border-right:1px solid var(--line);overflow:auto;padding:10px 0}
.nh{padding:8px 14px 4px;font-size:12px;font-weight:600;color:var(--mut);display:flex;align-items:center}
.nh button{margin-left:auto;background:none;border:0;padding:2px;border-radius:4px;color:var(--mut)}
.nf{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;height:32px;padding:0 14px;font-size:13.5px;position:relative}
.nf:hover{background:#f0f0f0}
.nf.on{background:var(--sel);font-weight:600;box-shadow:inset 3px 0 0 var(--or)}
.nf.drop{background:#ffd9c2;outline:2px dashed var(--ort);outline-offset:-3px}
.nf b{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--ort)}
.cdot{width:10px;height:10px;border-radius:3px;flex:none}
#content{flex:1;min-width:0;display:flex;position:relative}
#content.rp-right{flex-direction:row}
#content.rp-bottom,#content.rp-off{flex-direction:column}
#list{display:flex;flex-direction:column;min-width:0;min-height:0}
.rp-right #list{width:var(--listw,44%);border-right:1px solid var(--line)}
.rp-bottom #list{height:var(--listh,44%);border-bottom:1px solid var(--line)}
.rp-off #list{flex:1}
#lh{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#lh h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.seg{display:flex;background:#eee;border-radius:7px;padding:2px;gap:2px}
.seg button{border:0;background:none;border-radius:5px;padding:3px 11px;font-size:13px}
.seg button.on{background:#fff;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.15)}
#lh .sp{margin-left:auto;font-size:12.5px;color:var(--mut)}
#cols{flex:none;display:grid;align-items:center;height:30px;padding:0 14px;background:var(--soft);border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--mut);gap:8px}
.rp-right #cols{display:none}
.g{grid-template-columns:24px 20px var(--fromw,190px) minmax(0,1fr) auto 18px 104px 64px}
#rows{flex:1;overflow:auto;min-height:0}
.row{display:grid;align-items:center;min-height:38px;padding:0 14px;border-bottom:1px solid #ececec;gap:8px;cursor:default;position:relative}
.row:hover{background:#f7f7f7}
.row.sel{background:var(--sel)}
.row.unread .from,.row.unread .subj b{font-weight:700}
.row .from{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .subj{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .subj i{font-style:normal;color:var(--mut);font-weight:400}
.row .when,.row .size{font-size:13px;color:var(--mut);white-space:nowrap}
.row .cnt{font-size:11.5px;border:1px solid var(--line);border-radius:9px;padding:0 6px;margin-left:6px;color:var(--mut);font-weight:600}
.row .cats{display:flex;gap:3px}
.dot{width:9px;height:9px;border-radius:50%;background:transparent}
.unread .dot{background:var(--or)}
.chk{width:18px;height:18px;border:1.5px solid #8a8a8a;border-radius:4px;background:#fff;padding:0;display:grid;place-items:center;color:#fff}
.row.checked .chk{background:var(--ort);border-color:var(--ort)}
.fl{color:var(--ort)}
.rp-right .row{grid-template-columns:20px 20px minmax(0,1fr) auto;grid-template-areas:"c d f w" "c d s a";padding:8px 14px;row-gap:1px}
.rp-right .row .chk{grid-area:c}.rp-right .row .dot{grid-area:d}.rp-right .row .from{grid-area:f}.rp-right .row .when{grid-area:w}.rp-right .row .subj{grid-area:s}.rp-right .row .cats,.rp-right .row .size,.rp-right .row .att{display:none}.rp-right .row .rowfl{grid-area:a}
.dense .row{min-height:30px}
.sec{padding:6px 14px;font-size:12px;font-weight:600;color:var(--mut);background:#fafafa;border-bottom:1px solid #ececec}
.empty{padding:48px 24px;text-align:center;color:var(--mut)}
.more{display:block;margin:12px auto;padding:6px 16px;border:1px solid var(--line);background:#fff;border-radius:6px}
/* reading */
#reading{flex:1;min-width:0;min-height:0;overflow:auto;padding:18px 28px}
.rp-off #reading{display:none}
.rh h2{margin:0 0 8px;font-size:19px;letter-spacing:-.01em;line-height:1.3}
.cc{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:10px;padding:1px 9px;background:#f1f1f1;margin-right:6px}
.msg{border-top:1px solid var(--line);padding:14px 0}
.msg.fold{cursor:pointer}
.mh{display:flex;gap:12px;align-items:center}
.av{width:40px;height:40px;border-radius:50%;background:var(--blk);color:#fff;font-weight:600;font-size:13px;display:grid;place-items:center;flex:none}
.mh .who{line-height:1.35;min-width:0}
.mh .who small{color:var(--mut);font-size:12.5px;display:block}
.mh .dt{margin-left:auto;font-size:12.5px;color:var(--mut);white-space:nowrap}
.body{margin:12px 0 0 52px;font-size:14.5px;line-height:1.65;max-width:760px;overflow-wrap:anywhere}
.fold .body,.fold .atts{display:none}
.atts{margin:12px 0 0 52px;display:flex;flex-wrap:wrap;gap:8px}
.att-c{display:flex;align-items:center;gap:10px;border:1px solid #cfcfcf;border-radius:6px;padding:7px 12px;background:#fff;font-size:13px}
.att-c:hover{background:var(--soft)}
.ft{width:30px;height:30px;border-radius:5px;display:grid;place-items:center;font-size:10.5px;font-weight:700;background:#eee}
.qr{margin:14px 0 0 52px;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid #bdbdbd;background:#fff;border-radius:6px;padding:6px 14px;font-size:13.5px}
.btn:hover{background:var(--soft)}
.btn.p{background:var(--ort);border-color:var(--ort);color:#fff;font-weight:600}
.btn.p:hover{background:#9d3300}
.btn.d{color:#a12020}
.bar{background:#fff8e6;border:1px solid #e6d29a;border-radius:6px;padding:8px 12px;margin:0 0 10px;font-size:13px}
/* overlays */
#menu{position:fixed;z-index:80;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.2);min-width:190px;padding:4px;display:none;max-height:70vh;overflow:auto}
#menu button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:7px 12px;border-radius:5px;font-size:13.5px}
#menu button:hover{background:var(--soft)}
#menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#menu .ck{width:14px;color:var(--ort);font-weight:700}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--blk);color:#fff;border-radius:8px;padding:10px 16px;display:none;gap:16px;align-items:center;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast button{background:none;border:0;color:#ffb48f;font-weight:600;padding:0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:grid;place-items:center;padding:16px}
.dlg{background:#fff;border-radius:10px;width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg.w{width:min(820px,100%)}
.dlg>h3{margin:0;padding:16px 20px;font-size:16px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.dlg>h3 button{margin-left:auto;background:none;border:0;padding:2px}
.dlg .bd{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg .ft2{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.fld input,.fld select,.fld textarea{border:1px solid #bdbdbd;border-radius:6px;padding:7px 10px;font-weight:400;background:#fff}
.fld textarea{min-height:80px;resize:vertical}
.fld.h{flex-direction:row;align-items:center;gap:8px;font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lst{border:1px solid var(--line);border-radius:6px}
.lst>div{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid #ececec}
.lst>div:last-child{border-bottom:0}
.lst>div>button{margin-left:auto}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs2 button{border:0;background:none;padding:8px 14px}
.tabs2 button.on{font-weight:600;color:var(--ort);box-shadow:inset 0 -3px 0 var(--or)}
.kbd{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;font-size:13.5px}
kbd{background:var(--soft);border:1px solid #cfcfcf;border-radius:4px;padding:1px 7px;font:600 12px monospace;justify-self:start}
/* compose */
#cw{position:fixed;left:0;top:0;transform:none;width:100vw;height:100vh;background:#fff;border:0;border-radius:0;box-shadow:none;z-index:70;display:none;flex-direction:column;overflow:hidden}
#cw.on{display:flex}
#cscrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:65;display:none}
#cw.on+#cscrim,#cscrim.on{display:block}
.chead{flex:none;height:40px;background:var(--blk);color:#fff;display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;font-weight:600;font-size:13.5px;border-bottom:3px solid var(--or)}
.cmain{flex:none;display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:#fff;overflow-x:auto}
.cmain .grp{padding:6px 10px 4px}
.sendb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--ort);color:#fff;border:0;border-radius:6px;margin:10px 10px 8px 12px;padding:0 18px;height:60px;min-width:68px;align-self:start;font-weight:600;font-size:13px}
.sendb:hover{background:#9d3300}
.ctabs{flex:none;display:flex;background:var(--soft);padding:0 12px;border-bottom:1px solid var(--line)}
.chead button{background:none;border:0;color:#fff;padding:6px;border-radius:5px}
.chead button:hover{background:#2a2a2a}
.cbody{flex:1;min-height:0;display:flex;flex-direction:column}
.ctool{flex:none;display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.ctool .btn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px}
.ctool .ic{border:0;background:none;padding:5px;border-radius:5px}
.ctool .ic:hover{background:var(--soft)}
.crow{flex:none;display:flex;align-items:center;gap:8px;border-bottom:1px solid #ececec;padding:4px 14px;min-height:36px;flex-wrap:wrap}
.crow label{width:56px;color:var(--mut);font-size:13px}
.crow input,.crow select{flex:1;min-width:120px;border:0;outline:0;padding:5px 0;background:transparent}
.rc{display:inline-flex;gap:6px;align-items:center;background:#f1f1f1;border-radius:12px;padding:1px 4px 1px 10px;font-size:13px}
.rc button{border:0;background:none;padding:0 4px;font-size:15px;line-height:1}
.crow .lk{border:0;background:none;color:var(--ort);font-size:13px;padding:0 4px}
#cbody{flex:1;overflow:auto;padding:14px 16px;outline:0;font-size:14.5px;line-height:1.6;min-height:120px}
#cfiles{flex:none;display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 6px}
.cfoot{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.cfoot .sp{margin-left:auto;font-size:12.5px;color:var(--mut)}
/* splitters */
.split{flex:none;position:relative;z-index:6;background:transparent;transition:background .1s}
.split.v,.rp-right .split{width:6px;margin:0 -3px;cursor:col-resize}
.rp-bottom #sp2{height:6px;margin:-3px 0;cursor:row-resize;width:auto}
.rp-off #sp2{display:none}
#sp1{margin:0 -3px 0 -3px}
.split:hover,.split:focus-visible,.split.drag{background:rgba(255,80,1,.55)}
.colgrip{position:absolute;right:-5px;top:-8px;bottom:-8px;width:10px;cursor:col-resize}
.colgrip:hover{background:rgba(255,80,1,.45)}
body.dragging{user-select:none}
/* compose v2 */
.crow[hidden]{display:none}
.chd{flex:none;display:grid;grid-template-columns:auto 1fr;border-bottom:1px solid var(--line)}
.cf{display:flex;flex-direction:column;min-width:0}
.cf .crow{border-bottom:1px solid #ececec}.cf .crow:last-child{border-bottom:0}
.pk{border:1px solid #cfcfcf;background:#f7f7f7;border-radius:4px;padding:3px 12px;font-size:13px;min-width:64px}
.pk:hover{background:var(--sel)}
.ctabs .tab{height:34px}
.cmini{flex:none;display:flex;align-items:center;gap:2px;padding:4px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ib{width:30px;height:28px;border:0;background:none;border-radius:5px;display:grid;place-items:center;padding:0;flex:none}
.ib:hover{background:var(--soft)}.ib.on{background:var(--sel)}
.ib svg.i{width:17px;height:17px}
.dd{height:26px;border:1px solid #cfcfcf;background:#fff;border-radius:4px;padding:0 8px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;min-width:60px;justify-content:space-between}
.dd:hover{background:var(--soft)}
.rows2{display:flex;flex-direction:column;gap:6px;justify-content:center}
.rows2>div{display:flex;gap:1px;align-items:center}
.sm{display:flex;align-items:center;gap:6px;border:0;background:none;padding:3px 8px;border-radius:5px;font-size:12.5px;white-space:nowrap}
.sm:hover{background:var(--soft)}
.stack{display:flex;gap:2px;align-items:stretch}.col{display:flex;flex-direction:column;justify-content:center}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
#cw:not(.inline) .cmini,#cw:not(.inline) .inl,#cw:not(.inline) #cpop{display:none}
#cw.inline{transform:none;border-radius:0;border:0;border-top:3px solid var(--or);box-shadow:0 -10px 28px rgba(0,0,0,.16);z-index:40}
#cw.inline .ctabs,#cw.inline .cmain,#cw.inline #rsub,#cw.inline #rfrom{display:none}
#cw.inline .chead{height:34px;background:#fff;color:var(--ink);border-bottom:1px solid var(--line)}
#cw.inline .chead button{color:var(--ink)}#cw.inline .chead button:hover{background:var(--soft)}
#cw.inline .sendb{padding:0 18px;margin:6px 8px}
#cw.inline #cscrim{display:none}
#cw.inline.on+#cscrim{display:none}
#cw.inline #cbody{padding:10px 14px}
#cbody blockquote{margin:0}
#cbody table{border-collapse:collapse}#cbody td{border:1px solid #bbb;padding:4px 10px;min-width:60px}
/* import */
details summary{padding:4px 0}
/* phone */
@media (max-width:900px){
 #burger{display:block}#brand{font-size:15px}
 #nav{position:fixed;z-index:50;top:55px;bottom:0;left:0;width:260px;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.3)}
 body.navopen #nav{transform:none}
 #content{flex-direction:column!important}
 #list,.rp-right #list,.rp-bottom #list{width:100%;height:100%;flex:1;border:0}
 #cols{display:none}
 .row{grid-template-columns:20px 20px minmax(0,1fr) auto!important;grid-template-areas:"c d f w" "c d s a"!important;padding:8px 12px!important}
 .row .chk{grid-area:c}.row .dot{grid-area:d}.row .from{grid-area:f}.row .when{grid-area:w}.row .subj{grid-area:s}.row .cats,.row .size,.row .att{display:none}
 #reading{position:absolute;inset:0;background:#fff;z-index:20;display:none!important;padding:14px 16px}
 body.reading #reading{display:block!important}
 .body,.atts,.qr{margin-left:0}
 #cw{left:0;top:0;transform:none;width:100vw;height:100vh;border-radius:0;border:0}
 #sbox{flex:1}#topr .hide-s{display:none}
 .two{grid-template-columns:1fr}
 .split{display:none}
 .chd{grid-template-columns:1fr}.sendb{flex-direction:row;padding:10px 20px;margin:8px 12px}
}
@media print{#top,#tabs,#ribbon,#nav,#list,#cw,#toast,.qr,.scrim{display:none!important}body{overflow:visible}#app,#main,#content{display:block;height:auto}#reading{padding:0;overflow:visible;position:static;display:block!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.atbl{border-collapse:collapse;width:100%;font-size:13px}.atbl th{text-align:left;font-weight:600;color:var(--mut);padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}.atbl td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}.atbl input,.atbl select{width:100%;min-width:90px;border:1px solid #bdbdbd;border-radius:6px;padding:5px;font:inherit}

<script>/* ===== Rugs Mail: data, state, helpers ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const H = 36e5, D = 24 * H;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const ic = n => `<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const LS = 'rugsmail.v4';

const SYS = [
  { id: 'inbox', name: 'Inbox', icon: 'mail' }, { id: 'flagged', name: 'Flagged', icon: 'flag', virtual: true },
  { id: 'drafts', name: 'Drafts', icon: 'pen' }, { id: 'sent', name: 'Sent items', icon: 'send' },
  { id: 'scheduled', name: 'Scheduled', icon: 'clock' }, { id: 'snoozed', name: 'Snoozed', icon: 'moon', virtual: true },
  { id: 'archive', name: 'Archive', icon: 'archive' }, { id: 'junk', name: 'Junk', icon: 'ban' },
  { id: 'deleted', name: 'Deleted items', icon: 'trash' }
];
const CATS = [
  { id: 'buyers', name: 'Buyers', c: '#0f6cbd' }, { id: 'urgent', name: 'Urgent', c: '#c4262e' },
  { id: 'dispatch', name: 'Dispatch', c: '#107c41' }, { id: 'fair', name: 'Trade fair', c: '#8764b8' },
  { id: 'accounts', name: 'Accounts', c: '#986f0b' }
];
const TEMPLATES0 = [
  { id: 't1', name: 'Confirm order', subj: 'Order confirmation', body: 'Hello,\n\nWe confirm receipt of your order. Production will begin once the advance is received. We will share the delivery window within two working days.\n\nRegards' },
  { id: 't2', name: 'Sample dispatch', subj: 'Samples dispatched', body: 'Hello,\n\nThe samples you requested were dispatched today. Tracking details are below.\n\nCourier:\nTracking no.:\n\nRegards' },
  { id: 't3', name: 'Trade fair invite', subj: 'Visit us at the fair', body: 'Hello,\n\nWe would be glad to host you at our stall. Please let us know a suitable time and we will reserve it.\n\nRegards' }
];
const ACCTS0 = [
  { id: 'pt', name: 'Priyanshu Tomar', email: 'marketing@rugscreation.com', sig: '', desig: 'Marketing Executive', phone: '9540576972, 9053400366', loc: 'Karnal, Haryana, India' },
  { id: 'ex', name: 'Export Desk', email: 'export@rugscreation.com', sig: '', desig: 'Export Desk', loc: 'Karnal, Haryana, India' }
];

function seed() {
  const n = Date.now(), m = [];
  const add = (o) => m.push(Object.assign({ id: uid(), folder: 'inbox', read: false, flag: false, pin: false, cats: [], att: [], to: ['marketing@rugscreation.com'], cc: [], focused: true, snooze: 0, thread: null }, o));
  const P = (n_, e) => ({ n: n_, e });
  const anita = P('Anita Rao', 'anita@hartwell-imports.example');
  add({ thread: 'po4471', from: anita, subj: 'PO 4471: hand-tufted wool runners', date: n - 3 * D, read: true, body: '<p>Hello Priyanshu,</p><p>Please find the first PO for hand-tufted wool runners, 2.5 x 8 ft. Quantity is 60 pieces in Dune.</p><p>Regards,<br>Anita</p>', cats: ['buyers'] });
  add({ thread: 'po4471', from: P('Priyanshu Tomar', 'marketing@rugscreation.com'), to: ['anita@hartwell-imports.example'], subj: 'Re: PO 4471: hand-tufted wool runners', date: n - 2.9 * D, read: true, folder: 'sent', body: '<p>Hello Anita,</p><p>Received, thank you. We will confirm the delivery window shortly.</p>' });
  add({ thread: 'po4471', from: anita, cc: ['dispatch@rugscreation.com'], subj: 'Revised PO 4471: hand-tufted wool runners', date: n - 40 * 60000, body: '<p>Hello Priyanshu,</p><p>We have revised the quantities on PO 4471 after the showroom review. The runner order goes from 60 to 80 pieces, and the colourway is now Slate Grey instead of Dune. Please confirm the new delivery window before Friday.</p><p>Could you also send updated swatches and a fresh proforma invoice? The revised sheet is attached.</p><p>Regards,<br>Anita</p>', att: [{ name: 'PO-4471-rev2.xlsx', size: 49152, type: 'application/vnd.ms-excel' }, { name: 'Colourway-slate-grey.pdf', size: 1258291, type: 'application/pdf' }], cats: ['buyers', 'urgent'], flag: true });
  add({ from: P('Dispatch Desk', 'dispatch@rugscreation.com'), subj: 'Container MSKU-83 loaded, ETA Nhava Sheva Nov 19', date: n - 1.4 * H, body: '<p>Container MSKU-83 was loaded this morning. Seal number and packing list are attached for your records.</p>', att: [{ name: 'packing-list-MSKU83.pdf', size: 215040, type: 'application/pdf' }], cats: ['dispatch'] });
  add({ from: P('Vikram Sethi', 'vikram@rugscreation.com'), subj: 'October invoice reconciliation', date: n - 2.2 * H, body: '<p>Three invoices show a mismatch against the bank statement. Can you check the buyer references before Wednesday?</p>', att: [{ name: 'oct-recon.xlsx', size: 38912, type: 'application/vnd.ms-excel' }], cats: ['accounts'] });
  add({ from: P('EPCH Secretariat', 'fairs@epch.example'), subj: '62nd fair: stall layout confirmation', date: n - 1 * D - 2 * H, read: true, body: '<p>Please confirm stall B-214 and the electrical load by Tuesday so we can finalise the floor plan.</p>', att: [{ name: 'floor-plan.pdf', size: 1468006, type: 'application/pdf' }], cats: ['fair'] });
  add({ from: P('Sample Room', 'samples@rugscreation.com'), subj: 'Swatches for Kasa Living approved', date: n - 1 * D - 5 * H, read: true, body: '<p>The buyer signed off on all six swatches. Ready to dispatch on your word.</p>', cats: ['buyers'] });
  add({ from: P('Meera Joshi', 'meera@rugscreation.com'), subj: 'Diwali holiday roster', date: n - 2 * D, read: true, body: '<p>Please share team availability for the marketing desk by Monday.</p>' });
  add({ from: P('Karan Malik', 'karan@rugscreation.com'), subj: 'Loom schedule, week 47', date: n - 2 * D - 3 * H, read: true, body: '<p>Two looms are free from Thursday. Can we pull the Hartwell order forward?</p>' });
  add({ from: P('Kasa Living', 'orders@kasaliving.example'), subj: 'Re: Swatch approvals and next season colours', date: n - 3.5 * D, read: true, body: '<p>Thank you for the swatches. We would like to see two more earthy tones for the spring range.</p>', cats: ['buyers'], focused: false });

  grip($('#sp3'), ev => { const c = $('#cols > span:nth-child(3)').getBoundingClientRect(); S_.fromW = clamp(Math.round(ev.clientX - c.left), 90, 420); }, () => { delete S_.fromW; }, d => { S_.fromW = clamp((S_.fromW || 190) + d * 16, 90, 420); });
  addEventListener('resize', () => { if (S.compose) placeInline(); });
}
document.addEventListener('mousedown', e => { if (e.target.closest('#cmain button,#cmini button,#menu button')) e.preventDefault(); });
$('#csub').addEventListener('input', setTitle);

load().then(() => {
  renderAll(); applySizes(); initSplit(); tick(); setInterval(tick, 15000);
  matchMedia('(max-width:900px)').addEventListener('change', renderAll);
  addEventListener('beforeunload', flush); document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
});
