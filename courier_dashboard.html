}\n  function istToday(){ return new Date(Date.now()+19800000).toISOString().slice(0,10); }\n  function demandFor(key,w){\n    const c=demandCfg(), today=istToday();\n    if(!c.on || today<c.from || today>c.to || !(w>0)) return {amount:0};\n    const zn=demandZone(key), pk=+c.rates[zn]||0;\n    return {amount:pk*w, perKg:pk, zone:zn, label:(DZ_LIST.find(x=>x[0]===zn)||[0,zn])[1]+' zone', to:c.to};\n  }\n  /* ---- FedEx demand surcharge (export from India): Rs per chargeable kg by destination region, minimum per shipment,\n          plus per-package charges for non-standard (additional handling / oversize) packages ---- */\n  const FDEMAND_DEFAULT = {on:true, from:'2026-10-28', to:'2027-02-28', min:92,\n    rates:{USCA:180, EUROPE:139, APAC:50, AUNZ:77, GCC:77, MEISA:77, ROW:109},\n    ns:{on:true, to:'2027-02-07', ahs:137, oversize:275}};\n  const FZ_LIST = [['USCA','US & Canada'],['EUROPE','Europe'],['APAC','APAC (excl. AU & NZ)'],['AUNZ','AU & NZ'],['GCC','GCC'],['MEISA','SSA & Rest of MEISA'],['ROW','Rest of World']];\n  const F_USCA = 'USA|U S A|UNITED STATES|UNITED STATES OF AMERICA|USA UNITED STATES|CANADA'.split('|');\n  const F_GCC = 'UNITED ARAB EMIRATES|U A E|UAE|ARE|BAHRAIN|JORDAN|KUWAIT|OMAN|SAUDI ARABIA|QATAR'.split('|');\n  const F_MEISA_ASIA = 'PAKISTAN|BANGLADESH|SRI LANKA|NEPAL|BHUTAN|MALDIVES|AFGHANISTAN|KAZAKHSTAN|UZBEKISTAN|TURKMENISTAN|TAJIKISTAN|KYRGYZSTAN|GEORGIA|ARMENIA|AZERBAIJAN'.split('|');\n  const F_EUROPE_EXTRA = 'TURKEY|RUSSIA|RUSSIAN FEDERATION|UKRAINE|BELARUS|MOLDOVA|REPUBLIC OF MOLDOVA'.split('|');\n  function fedexZone(key){\n    const k = loose(key||''), dz = demandZone(key);\n    if(dz==='AM') return F_USCA.includes(k) ? 'USCA' : 'ROW';\n    if(dz==='Oceania') return (k==='AUSTRALIA'||k==='NEW ZEALAND') ? 'AUNZ' : 'APAC';\n    if(dz==='CN_HK') return 'APAC';\n    if(dz==='Asia') return F_MEISA_ASIA.includes(k) ? 'MEISA' : 'APAC';\n    if(dz==='MENA') return F_GCC.includes(k) ? 'GCC' : (k==='TURKEY' ? 'EUROPE' : 'MEISA');\n    if(dz==='EU') return 'EUROPE';\n    return F_EUROPE_EXTRA.includes(k) ? 'EUROPE' : 'MEISA';\n  }\n  function fedexCfg(){ const c=(DATA.rules&&DATA.rules.fedexDemand)||{}, n=c.ns||{};\n    return {on:c.on!==false, from:c.from||FDEMAND_DEFAULT.from, to:c.to||FDEMAND_DEFAULT.to, min:(c.min!=null?c.min:FDEMAND_DEFAULT.min),\n      rates:Object.assign({},FDEMAND_DEFAULT.rates,c.rates||{}),\n      ns:{on:n.on!==false, to:n.to||FDEMAND_DEFAULT.ns.to, ahs:(n.ahs!=null?n.ahs:FDEMAND_DEFAULT.ns.ahs), oversize:(n.oversize!=null?n.oversize:FDEMAND_DEFAULT.ns.oversize)}}; }\n  function fedexDemandFor(key,t){\n    const c=fedexCfg(), today=istToday(), w=t.chargeableWeight; let amount=0, perKg=0, label='', ns=0;\n    if(c.on && today>=c.from && today<=c.to && w>0){ const zn=fedexZone(key); perKg=+c.rates[zn]||0; amount=Math.max(+c.min||0, perKg*w); label=(FZ_LIST.find(x=>x[0]===zn)||[0,zn])[1]; }\n    if(c.ns.on && today>=c.from && today<=c.ns.to && w>0) ns = c.ns.oversize*(t.n2||0) + c.ns.ahs*(t.n3||0);\n    return {amount, perKg, ns, label, to:c.to};\n  }\n  function calc(input){\n    const type = input.type==='Document' ? 'Document' : 'Sample';\n    const z = resolve(input.country||'');\n    const t = totals(type, input.rows);\n    if(!(input.country||'').trim()) return {status:'need-country',totals:t};\n    if(!z.found) return {status:'bad-country',totals:t,zones:z};\n    if(type==='Sample' && t.packageCount===0) return {status:'need-packages',totals:t,zones:z};\n\n    const defs = {\n      'Direct DHL':   {zone:z.dhl, label:z.dhl?('Zone '+z.dhl):null, disp:z.dhl?('DHL zone '+z.dhl):null, over:t.n8>0?DATA.rules.dhlFlatCharge:0, wt:0,\n                       note:'One flat charge applies if any package is oversize or overweight.'},\n      'FedEx Direct': {zone:z.fedex, label:z.fedex, disp:z.fedex?('FedEx zone '+z.fedex):null, over:DATA.rules.fedexOversizeCharge*t.n2, wt:DATA.rules.fedexOverweightCharge*t.n3,\n                       note:'Oversize and overweight charges apply per package, reduced where long boxes can be combined.'},\n      'ADL FedEx':    {zone:z.adlfedex, label:z.adlfedex, disp:z.adlfedex?('ADL zone '+z.adlfedex):null, over:0, wt:DATA.rules.adlFedexOverweightCharge*t.overweightCount,\n                       note:'Oversize surcharge is waived. Overweight applies per package above 25 kg.'},\n      'ADL Self':     {zone:z.adlself, label:z.adlself, disp:z.adlself?('ADL Self \u00b7 '+z.adlself):null, over:0, wt:DATA.rules.adlSelfOverweightCharge*t.overweightCount,\n                       note:'Oversize surcharge is waived. Overweight applies per package above 25 kg. Listed European countries only.'}\n    };\n    const GST_RATE = 0.18;\n    const results = SERVICES.map(s=>{\n      const d = defs[s.key];\n      const base = {key:s.key, short:s.short, color:s.color, zoneText:d.disp||'Not available for this country', note:d.note};\n      const lk = lookup(s.key, t.chargeableWeight, d.label);\n      if(lk.error) return Object.assign(base,{available:false,reason:d.label?lk.error:(s.key==='ADL Self'?'Not offered for this country':'No zone found for this country'),total:Infinity});\n      const fuelPct = DATA.fuel[s.key]||0, fuel = lk.value*fuelPct;\n      const dem = s.key==='Direct DHL' ? demandFor(z.key,t.chargeableWeight) : (s.key==='FedEx Direct' ? fedexDemandFor(z.key,t) : {amount:0});\n      const subtotal = lk.value+d.over+d.wt+fuel+dem.amount+(dem.ns||0), gst = subtotal*GST_RATE;   // 18% GST on freight + surcharges + fuel\n      return Object.assign(base,{available:true,base:lk.value,oversize:d.over,overweight:d.wt,fuelPct,fuel,demand:dem.amount||0,demandPerKg:dem.perKg||0,demandZone:dem.zone||'',demandLabel:dem.label||'',demandNs:dem.ns||0,demandTo:dem.to||'',subtotal,gstPct:GST_RATE,gst,total:subtotal+gst});\n    });\n    const ok = results.filter(r=>r.available).sort((a,b)=>a.total-b.total);\n    const bad = results.filter(r=>!r.available);\n    return {status:'ok',type,totals:t,zones:z,ladder:ok,unavailable:bad,best:ok[0]||null,next:ok[1]||null,alert:alertText(type,t)};\n  }\n  return {calc,resolve,normalize,expand,volWt,roundUpHalf,totals,reindex,DEMAND_DEFAULT,DZ_LIST,demandCfg,demandZone,FDEMAND_DEFAULT,FZ_LIST,fedexCfg,fedexZone};\n})();\nStore.hook = Engine.reindex;\n<\/script>\n\n<script id=\"ui\">\n(function(){\n  const $ = id => document.getElementById(id);\n  const inr = n => '\u20b9' + n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});\n  const inr0 = n => '\u20b9' + Math.round(n).toLocaleString('en-IN');\n  const esc = s => String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\n  const kg = n => (Math.round(n*100)/100).toString();\n\n  let type = 'Sample', seq = 1, rows = [], lastQuote = null, grewFor = '';\n  const newRow = (kind) => ({id:seq++,kind:kind||'box',length:'',width:'',height:'',weight:'',qty:'1'});\n\n  /* ----- shipment type ----- */\n  function setType(t){\n    type = t;\n    $('tSample').setAttribute('aria-pressed', t==='Sample');\n    $('tDoc').setAttribute('aria-pressed', t==='Document');\n    $('pkgPanel').hidden = (t==='Document');\n    refresh();\n  }\n  $('tSample').onclick = () => setType('Sample');\n  $('tDoc').onclick = () => setType('Document');\n\n  /* ----- destination combobox ----- */\n  const cIn = $('country'), cList = $('clist');\n  let cItems = [], cActive = -1;\n  function openList(items){\n    cItems = items; cActive = -1;\n    if(!items.length){ cList.hidden = true; cIn.setAttribute('aria-expanded','false'); return; }\n    const q = cIn.value.trim();\n    cList.innerHTML = items.map((c,i)=>{\n      let label = esc(c);\n      if(q){ const at = c.toLowerCase().indexOf(q.toLowerCase()); if(at>-1) label = esc(c.slice(0,at))+'<mark>'+esc(c.slice(at,at+q.length))+'<\/mark>'+esc(c.slice(at+q.length)); }\n      return `<li role=\"option\" id=\"co${i}\" data-i=\"${i}\">${label}<\/li>`;\n    }).join('');\n    cList.hidden = false; cIn.setAttribute('aria-expanded','true');\n  }\n  function filterCountries(){\n    const q = cIn.value.trim().toLowerCase();\n    if(!q) return [];\n    const starts = [], has = [];\n    DATA.countries.forEach(c=>{ const l=c.toLowerCase(); if(l.startsWith(q)) starts.push(c); else if(l.includes(q)) has.push(c); });\n    return starts.concat(has).slice(0,8);\n  }\n  function pick(i){ if(cItems[i]){ cIn.value = cItems[i]; } cList.hidden = true; cIn.setAttribute('aria-expanded','false'); refresh(); }\n  function mark(i){\n    [...cList.children].forEach((li,k)=>li.setAttribute('aria-selected', k===i));\n    cActive = i; if(i>=0){ cIn.setAttribute('aria-activedescendant','co'+i); cList.children[i].scrollIntoView({block:'nearest'}); }\n  }\n  cIn.addEventListener('input', ()=>{ openList(filterCountries()); refresh(); });\n  cIn.addEventListener('focus', ()=>{ if(cIn.value.trim()) openList(filterCountries()); });\n  cIn.addEventListener('keydown', e=>{\n    if(e.key==='ArrowDown'){ e.preventDefault(); if(cList.hidden) openList(filterCountries()); mark(Math.min(cActive+1,cItems.length-1)); }\n    else if(e.key==='ArrowUp'){ e.preventDefault(); mark(Math.max(cActive-1,0)); }\n    else if(e.key==='Enter'){ if(!cList.hidden && cItems.length){ e.preventDefault(); pick(cActive>=0?cActive:0); focusCell(rows[0].id,'length'); } else { focusCell(rows[0].id,'length'); } }\n    else if(e.key==='Escape'){ cList.hidden = true; cIn.setAttribute('aria-expanded','false'); }\n  });\n  cList.addEventListener('mousedown', e=>{ const li=e.target.closest('li'); if(li){ e.preventDefault(); pick(+li.dataset.i); } });\n  cIn.addEventListener('blur', ()=>{ setTimeout(()=>{ cList.hidden = true; cIn.setAttribute('aria-expanded','false'); },120); });\n\n  [['United States','USA'],['United Kingdom','UK'],['Germany','Germany'],['Australia','Australia'],['Belgium','Belgium'],['U.A.E.','UAE']].forEach(([n,l])=>{\n    const b=document.createElement('button'); b.type='button'; b.textContent=l; b.onclick=()=>{ cIn.value=n; cList.hidden=true; refresh(); focusCell(rows[0].id,'length'); }; $('quick').appendChild(b);\n  });\n\n  /* ----- packages ----- */\n  const FIELDS = ['length','width','height','weight','qty'];\n  function focusCell(id, f){ const el = document.querySelector(`input[data-id=\"${id}\"][data-f=\"${f}\"]`); if(el){ el.focus(); el.select(); } }\n  function rowMeta(p){\n    const L=parseFloat(p.length),W=parseFloat(p.width),H=parseFloat(p.height),wt=parseFloat(p.weight);\n    const tags = [`<button type=\"button\" class=\"tag kindtag\" data-kind=\"${p.id}\" title=\"Tap to switch between box, bale and packet\">${p.kind==='bale'?'\ud83e\uddf6 Bale':p.kind==='packet'?'\u2709\ufe0f Packet':'\ud83d\udce6 Box'}<\/button>`];\n    if(L>0&&W>0&&H>0) tags.push(`<span class=\"tag\">Volumetric ${kg(Engine.volWt({L,W,H}))} kg<\/span>`);\n    if(L>DATA.rules.oversizeLimitCm) tags.push(`<span class=\"tag warn\">Over ${DATA.rules.oversizeLimitCm} cm long<\/span>`);\n    if(wt>DATA.rules.overweightLimitKg) tags.push(`<span class=\"tag warn\">Over ${DATA.rules.overweightLimitKg} kg<\/span>`);\n    return tags.join('');\n  }\n  function renderRows(){\n    $('pkgs').innerHTML = rows.map((p,i)=>`\n      <div class=\"pk\" data-row=\"${p.id}\">\n        <div class=\"pk-row\">\n          <span class=\"pk-n\">${i+1}<\/span>\n          ${FIELDS.map(f=>`<input class=\"input\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"${f==='qty'?1:'any'}\" value=\"${esc(p[f])}\" data-id=\"${p.id}\" data-f=\"${f}\" aria-label=\"Package ${i+1} ${f==='qty'?'quantity':f}\">`).join('')}\n          <button class=\"x\" type=\"button\" data-rm=\"${p.id}\" aria-label=\"Remove package ${i+1}\">\u2715<\/button>\n        <\/div>\n        <div class=\"pk-row\"><span><\/span><div class=\"pk-meta\" id=\"meta${p.id}\" style=\"grid-column:2 / 7\">${rowMeta(p)}<\/div><\/div>\n      <\/div>`).join('');\n  }\n  $('pkgs').addEventListener('input', e=>{\n    const el = e.target; if(!el.dataset.f) return;\n    const p = rows.find(r=>r.id===+el.dataset.id); p[el.datas .ns.oversize}\"><\/div>\n        <\/div>`})()}\n      <\/section>\n      <section class=\"pt-card wide\"><h3>Surcharges and limits<\/h3><div class=\"pt-rules\">\n        ${Store.RULES.map(([f,l,h])=>`<div class=\"field\"><label class=\"lbl\" for=\"ru_${f}\">${l}<\/label><input class=\"input\" id=\"ru_${f}\" inputmode=\"decimal\" data-g=\"rules\" data-s=\"${f}\" value=\"${draft.rules[f]==null?'':draft.rules[f]}\"><div class=\"hint\">${esc(h)}<\/div><\/div>`).join('')}\n      <\/div><\/section><\/div>`;\n  }\n\n  /* rate tables */\n  function tableHTML(k){\n    const t = TABLES.find(x=>x.key===k), v = draft[k];\n    const first = t.kind==='bracket' ? 'Weight (kg)' : 'From (kg)';\n    return `<div class=\"pt-bar\"><div><h3>${esc(t.title)}<\/h3><p class=\"sub\">${t.kind==='bracket'?'Each row is the price for a parcel of that weight or more, until the next row.':'Each row is the price per kg for parcels from that weight upward. Total = chargeable kg \u00d7 this rate.'} Leave a cell blank if the courier does not serve that lane.<\/p><\/div>\n      <div class=\"pt-act\"><button class=\"btn sec\" type=\"button\" data-a=\"addrow\">Add weight row<\/button><button class=\"btn sec\" type=\"button\" data-a=\"addzone\">Add zone column<\/button><\/div><\/div>\n      <div class=\"gwrap\"><table class=\"gtable\"><thead><tr><th class=\"c0\">${first}<\/th>${v.zones.map((z,j)=>`<th><input class=\"gh\" data-k=\"${k}\" data-z=\"${j}\" value=\"${esc(z)}\" aria-label=\"Zone name\"><button type=\"button\" class=\"gx${delArm==='z'+j?' arm':''}\" data-a=\"delzone\" data-j=\"${j}\" title=\"Delete this zone column\">${delArm==='z'+j?'Sure?':'\u00d7'}<\/button><\/th>`).join('')}<th><\/th><\/tr><\/thead>\n      <tbody>${v.rows.map((r,i)=>`<tr>${r.slice(0,v.zones.length+1).map((x,c)=>`<${c?'td':'th class=\"c0\"'}><input class=\"gi\" inputmode=\"decimal\" data-k=\"${k}\" data-r=\"${i}\" data-c=\"${c}\" value=\"${x==null?'':x}\" aria-label=\"${c?esc(v.zones[c-1])+' price, row '+(i+1):'Weight, row '+(i+1)}\"><\/${c?'td':'th'}>`).join('')}<td><button type=\"button\" class=\"gx${delArm==='r'+i?' arm':''}\" data-a=\"delrow\" data-i=\"${i}\" title=\"Delete this row\">${delArm==='r'+i?'Sure?':'\u00d7'}<\/button><\/td><\/tr>`).join('')}<\/tbody><\/table><\/div>`;\n  }\n\n  /* countries */\n  function zoneSets(){\n    const dz = draft.dhl_rates.zones.map(z=>String(z).replace(/^Zone\\s*/i,'')), set = a => new Set(a.map(z=>String(z).toUpperCase()));\n    return {dhl:set(dz), fedex:set(draft.fedex_rates.zones), adlf:set(draft.adl_fedex_rates.zones), adls:set(draft.adl_forward_rates.zones), dz};\n  }\n  function countriesHTML(){\n    const z = zoneSets(), q = cFilter.trim().toLowerCase();\n    const cell = (i,c,val,set) => { const bad = val && !set.has(String(val).toUpperCase()); return `<td><input class=\"gi tx${bad?' bad':''}\" data-k=\"country_master\" data-r=\"${i}\" data-c=\"${c}\" value=\"${esc(val==null?'':val)}\" ${c>=2?'list=\"dl'+c+'\"':''} aria-label=\"${['Country','Key','DHL zone','FedEx zone','ADL FedEx zone','ADL Self zone'][c]}\"><\/td>`; };\n    const rows = draft.country_master.map((r,i)=>({r,i})).filter(x=>!q || String(x.r[0]).toLowerCase().includes(q) || String(x.r[1]).toLowerCase().includes(q));\n    const dl = (id,arr) => `<datalist id=\"${id}\">${arr.map(a=>`<option value=\"${esc(a)}\">`).join('')}<\/datalist>`;\n    return `<div class=\"pt-bar\"><div><h3>Countries and zones<\/h3><p class=\"sub\">${draft.country_master.length} countries. Pick the zone each courier uses for a country. Orange cells use a zone that does not exist in that courier\u2019s rate table.<\/p><\/div>\n      <div class=\"pt-act\"><input class=\"input\" id=\"cFind\" placeholder=\"Search country\" value=\"${esc(cFilter)}\" aria-label=\"Search country\"><button class=\"btn sec\" type=\"button\" data-a=\"addcountry\">Add country<\/button><\/div><\/div>\n      ${dl('dl2',z.dz)}${dl('dl3',draft.fedex_rates.zones)}${dl('dl4',draft.adl_fedex_rates.zones)}${dl('dl5',draft.adl_forward_rates.zones)}\n      <div class=\"gwrap\"><table class=\"gtable ctab\"><thead><tr><th class=\"c0\">Country<\/th><th>Lookup key<\/th><th>DHL zone<\/th><th>FedEx zone<\/th><th>ADL FedEx zone<\/th><th>ADL Self zone<\/th><th><\/th><\/tr><\/thead>\n      <tbody>${rows.map(({r,i})=>`<tr><th class=\"c0\"><input class=\"gi tx\" data-k=\"country_master\" data-r=\"${i}\" data-c=\"0\" value=\"${esc(r[0]==null?'':r[0])}\" aria-label=\"Country\"><\/th><td><input class=\"gi tx key\" data-k=\"country_master\" data-r=\"${i}\" data-c=\"1\" value=\"${esc(r[1]==null?'':r[1])}\" aria-label=\"Key\"><\/td>${cell(i,2,r[2],z.dhl)}${cell(i,3,r[3],z.fedex)}${cell(i,4,r[4],z.adlf)}${cell(i,5,r[5],z.adls)}<td><button type=\"button\" class=\"gx${delArm==='c'+i?' arm':''}\" data-a=\"delcountry\" data-i=\"${i}\" title=\"Delete this country\">${delArm==='c'+i?'Sure?':'\u00d7'}<\/button><\/td><\/tr>`).join('') || '<tr><td colspan=\"7\" class=\"empty\">No country matches.<\/td><\/tr>'}<\/tbody><\/table><\/div>`;\n  }\n\n  /* excel + backup */\n  function dataHTML(){\n    return `<div class=\"pt-grid2\">\n      <section class=\"pt-card\"><h3>Import from Excel<\/h3><p class=\"sub\">Choose the rate workbook (.xlsx) with the sheets Rules_Config, BACKEND_FUEL_CONFIG, Country_Master, DHL_Rates, DHL_Multipliers, FedEx_Rates, and FedEx_PerKg. Anything found is loaded as unsaved changes so you can check it first.<\/p>\n        <button class=\"btn\" type=\"button\" data-a=\"xlsx\">Choose Excel file<\/button><div class=\"pt-res\" id=\"xRes\" aria-live=\"polite\"><\/div><\/section>\n      <section class=\"pt-card\"><h3>Backup<\/h3><p class=\"sub\">Download everything as one file, or restore from a file you saved earlier. Restoring loads unsaved changes; nothing goes live until you press Save.<\/p>\n        <div class=\"pt-act left\"><button class=\"btn sec\" type=\"button\" data-a=\"backup\">Download backup<\/button><button class=\"btn sec\" type=\"button\" data-a=\"restore\">Restore from backup<\/button><\/div><div class=\"pt-res\" id=\"bRes\" aria-live=\"polite\"><\/div><\/section><\/div>`;\n  }\n  function accountHTML(){\n    return `<div class=\"pt-grid2\"><section class=\"pt-card\"><h3>Change password<\/h3><p class=\"sub\">Signed in as ${esc(cred.u)}. Use at least 8 characters. Share the new password only with staff who edit rates.<\/p>\n      <div class=\"field\"><label class=\"lbl\" for=\"pwN\">New password<\/label><input class=\"input\" id=\"pwN\" type=\"password\" autocomplete=\"new-password\"><\/div>\n      <div class=\"field\"><label class=\"lbl\" for=\"pwC\">Repeat new password<\/label><input class=\"input\" id=\"pwC\" type=\"password\" autocomplete=\"new-password\"><\/div>\n      <button class=\"btn\" type=\"button\" data-a=\"setpw\">Change password<\/button><\/section><\/div>`;\n  }\n\n  /* edits */\n  function numOrNull(s){ s = s.trim().replace(/,/g,''); if(s==='') return null; const n = Number(s); return isFinite(n) ? n : NaN; }\n  $('pBody').addEventListener('input', e => {\n    const el = e.target; if(el.id==='cFind'){ cFilter = el.value; const p = el.selectionStart; renderTab(); const f = $('cFind'); f.focus(); f.setSelectionRange(p,p); return; }\n    if(el.dataset.g==='fd'){\n      if(!draft.rules.fedexDemand) draft.rules.fedexDemand = Store.clone(Engine.fedexCfg());\n      const c = draft.rules.fedexDemand, s = el.dataset.s; if(!c.ns) c.ns = Store.clone(Engine.fedexCfg().ns);\n      const num = () => { const n = numOrNull(el.value); el.classList.toggle('bad', n===null || isNaN(n) || n<0); return (n===null||isNaN(n)) ? NaN : n; };\n      if(s==='on') c.on = el.checked; else if(s==='ns_on') c.ns.on = el.checked;\n      else if(s==='from'||s==='to') c[s] = el.value; else if(s==='ns_to') c.ns.to = el.value;\n      else if(s==='min') c.min = num(); else if(s.indexOf('r_')===0) c.rates[s.slice(2)] = num();\n      else if(s.indexOf('ns_')===0) c.ns[s.slice(3)] = num();\n      mark('rules'); return;\n    }\n    if(el.dataset.g==='dd'){\n      if(!draft.rules.dhlDemand) draft.rules.dhlDemand = Store.clone(Engine.demandCfg());\n      const c = draft.rules.dhlDemand, s = el.dataset.s;\n      if(s==='on') c.on = el.checked; else if(s==='from'||s==='to') c[s] = el.value;\n      else { const n = numOrNull(el.value); el.classList.toggle('bad', n===null || isNaN(n) || n<0); c.rates[s] = (n===null||isNaN(n)) ? NaN : n; }\n      mark('rules'); return;\n    }\n    if(el.dataset.g){\n      const g = el.dataset.g, s = el.dataset.s, n = numOrNull(el.value);\n      el.classList.toggle('bad', n===null || isNaN(n));\n      if(n===null || isNaN(n)) { draft[g][s] = NaN; } else draft[g][s] = g==='fuel' ? Math.round(n*1e4)/1e6 : n;\n      mark(g); return;\n    }\n    const k = el.dataset.k; if(!k) return;\n    if(el.classList.contains('gh')){ draft[k].zones[+el.dataset.z] = el.value.trim(); mark(k); return; }\n    const r = +el.dataset.r, c = +el.dataset.c;\n    if(k==='country_master'){\n      const row = draft[k][r];\n      if(c===0 && row[1]===Engine.normalize(String(row[0]||''))){ row[1] = Engine.normalize(el.value); const kin = el.closest('tr').querySelector('.key'); if(kin) kin.value = row[1]; }\n      row[c] = c===1 ? el.value.toUpperCase() : el.value;\n      if(c===1) el.value = row[c];\n      if(c>=2){ const z = zoneSets(), set = [null,null,z.dhl,z.fedex,z.adlf,z.adls][c]; el.classList.toggle('bad', !!el.value.trim() && !set.has(el.value.trim().toUpperCase())); }\n      mark(k); return;\n    }\n    const n = numOrNull(el.value); el.classList.toggle('bad', isNaN(n) || (c===0 && n===null));\n    draft[k].rows[r][c] = n; mark(k);\n  });\n  function blankPad(v){ return Array(v.zones.length).fill(null); }\n  $('pBody').addEventListener('click', async e => {\n    const b = e.target.closest('[data-a]'); if(!b) return; const a = b.dataset.a, k = tab;\n    if(a==='addrow'){ const v = draft[k], last = v.rows.length ? v.rows[v.rows.length-1][0] : 0; v.rows.push([isNum(last) ? last + (v.rows.length>1 ? Math.max(0.5, last - v.rows[v.rows.length-2][0]) : 0.5) : 0.5].concat(blankPad(v))); mark(k); renderTab(); const sc = document.querySelector('.gwrap'); sc.scrollTop = sc.scrollHeight; }\n    else if(a==='addzone'){ const v = draft[k]; v.zones.push('New zone ' + (v.zones.length+1)); v.rows.forEach(r=>{ while(r.length < v.zones.length) r.push(null); }); mark(k); renderTab(); const sc = document.querySelector('.gwrap'); sc.scrollLeft = sc.scrollWidth; }\n    else if(a==='delrow'){ const id = 'r'+b.dataset.i; if(delArm!==id){ delArm = id; renderTab(); return; } draft[k].rows.splice(+b.dataset.i,1); delArm = null; mark(k); renderTab(); }\n    else if(a==='delzone'){ const id = 'z'+b.dataset.j; if(delArm!==id){ delArm = id; renderTab(); return; } const j = +b.dataset.j; draft[k].zones.splice(j,1); draft[k].rows.forEach(r=>r.splice(j+1,1)); delArm = null; mark(k); renderTab(); }\n    else if(a==='addcountry'){ draft.country_master.push(['','','','','','']); cFilter = ''; mark('country_master'); renderTab(); const sc = document.querySelector('.gwrap'); sc.scrollTop = sc.scrollHeight; const ins = document.querySelectorAll('.ctab tbody tr:last-child input'); if(ins[0]) ins[0].focus(); }\n    else if(a==='delcountry'){ const id = 'c'+b.dataset.i; if(delArm!==id){ delArm = id; renderTab(); return; } draft.country_master.splice(+b.dataset.i,1); delArm = null; mark('country_master'); renderTab(); }\n    else if(a==='xlsx'){ $('pFile').dataset.mode = 'xlsx'; $('pFile').accept = '.xlsx,.xlsm,.xls'; $('pFile').value = ''; $('pFile').click(); }\n    else if(a==='restore'){ $('pFile').dataset.mode = 'json'; $('pFile').accept = '.json,application/json'; $('pFile').value = ''; $('pFile').click(); }\n    else if(a==='backup'){ doBackup(); }\n    else if(a==='setpw'){ await changePw(); }\n  });\n\n  function putDraft(newDb, label){\n    const changed = [];\n    Object.keys(newDb).forEach(k => { if(JSON.stringify(newDb[k]) !== JSON.stringify(draft[k])){ draft[k] = clone(newDb[k]); dirty.add(k); changed.push(k); } });\n    warned = false; updFoot(); return changed;\n  }\n  const niceName = k => (TABS.find(t=>t.id===k)||{label:k}).label;\n  $('pFile').addEventListener('change', async () => {\n    const f = $('pFile').files[0]; if(!f) return; const mode = $('pFile').dataset.mode, out = $(mode==='xlsx'?'xRes':'bRes');\n    out.textContent = 'Reading ' + f.name + '\u2026';\n    try{\n      let parsed, skipped = [];\n      if(mode==='xlsx'){ await loadXLSX(); const wb = XLSX.read(await f.arrayBuffer(), {type:'array'}); ({db:parsed, skipped} = parseWorkbook(wb)); }\n      else { const j = JSON.parse(await f.text()); parsed = (j && j.data) ? j.data : j; Object.keys(parsed).forEach(k=>{ if(!Store.KEYS.includes(k)) delete parsed[k]; }); }\n      if(!Object.keys(parsed).length) throw new Error(mode==='xlsx' ? 'No rate sheets found in this file.' : 'This file has no rate data.');\n      const probe = Object.assign(clone(draft), clone(parsed)), chk = Store.validate(probe, Object.keys(parsed));\n      if(chk.errors.length){ out.innerHTML = '<b class=\"badt\">Not loaded.<\/b> Fix these in the file first:<ul>' + chk.errors.map(x=>'<li>'+esc(x)+'<\/li>').join('') + '<\/ul>'; return; }\n      Store.sortTables(probe);\n      const changed = putDraft(Object.fromEntries(Object.keys(parsed).map(k=>[k,probe[k]])));\n      out.innerHTML = (changed.length ? '<b class=\"okt\">Loaded as unsaved changes:<\/b> ' + changed.map(niceName).join(', ') + '. Review the tabs, then press Save changes.' : '<b class=\"okt\">Nothing to change.<\/b> The file matches what is live.') + (skipped.length ? '<div class=\"sub\">Not found in the file, left as is: ' + skipped.map(esc).join(', ') + '<\/div>' : '');\n      buildTabs();\n    }catch(err){ out.innerHTML = '<b class=\"badt\">Could not read the file.<\/b> ' + esc(err.message || err); }\n  });\n  function loadXLSX(){\n    return new Promise((res, rej) => {\n      if(window.XLSX) return res();\n      const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax   let tok='';try{const dd=JSON.parse(localStorage.getItem('deleg_doer')||'null');if(dd&&dd.doc_id===doc)tok=dd.session_token||''}catch(e){}

function words(n,cur){
  const O=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],T=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];

  const t=x=>(x>=100?O[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?h(x%100):'');
  const ind=cur==='INR';let u=ind?[[1e7,'Crore'],[1e5,'Lakh'],[1e3,'Thousand']]:[[1e9,'Billion'],[1e6,'Million'],[1e3,'Thousand']],out=[];
  let w=Math.floor(n);if(w===0)return 'Zero';

}

function SIGBLOCK(r){
  const ap=r.status==='Approved';
  const decl=`<b>Declaration</b><br>${esc(FMT.declaration||'We declare that this Invoice shows actual price of the goods described and that all particulars are true and correct.').replace(/\n/g,'<br>')}${r.d.terms||r.d.incoterm?'<br>'+[r.d.terms,r.d.incoterm].filter(Boolean).map(x=>esc(x)).join(' | '):''}`;
  const prep=`${r.emp_sig?`<img src="${r.emp_sig}" alt="Prepared by" style="max-height:46px;max-width:120px">`:'<div style="height:40px"></div>'}<br>Prepared by:<br><b>${esc(r.owner_name||'')}</b>`;
  const stp=ap?`<img src="${STAMP_IMG}" alt="Approved: gate pass OK stamp and signature" style="height:84px;width:84px;max-height:84px;max-width:84px"><br>Approved by: <b>${esc(r.appr_name||'')}</b>${FMT.show_approved_line===false?'':'<br>'+esc(new Date(r.appr_at).toLocaleString('en-IN'))}`:'<div style="height:40px"></div><span style="color:#b00">Not approved yet</span>';
  return `<div class="sig3"><div>${decl}</div><div>${prep}</div><div>${stp}</div><div class="b"><img src="${AUTH_IMG}" alt="For Rugs Creation - Authorised Signatory" style="width:200px;max-width:100%;max-height:none;height:auto"></div></div>`;
}
const WMK=r=>r.status==='Approved'?'':'<div class="wmk">PREVIEW - NOT APPROVED</div>';

function ppSpacerRow(){return '<tr class="pp-sp"><td colspan="9" style="height:8px;padding:0"></td></tr>'}
function ppBar(i,n,box,ship,pk,pi,np){
  if(box){const kind=[...new Set((pk.items||[]).map(x=>x.kind||'Box'))].join(' / ');
    return `<div class="cpy"><b class="box">Copy ${i} of ${n} · Box copy · Packet ${pi} of ${np}</b><span>Paste on packet ${pi} (${esc(kind)}${pk.dim?' · '+esc(pk.dim):''}${pk.wt?' · '+esc(pk.wt)+' kg':''})</span></div>`}
  return `<div class="cpy"><b>Copy ${i} of ${n} · Courier copy</b><span>Hand over to the courier company</span></div>`}
/* full invoice = today's invoiceHTML, but the fixed spacer becomes a row we size to fill the page */

/* courier copy: no "Prepared by / for", no internal approval stamp, no preparer signature; Local also hides prices + IEC/PAN */
function ppCourier(r){
  const d=r.d,b=d.buyer||{},P=normPk(d),cur=d.currency||'INR',intl=r.ship_type==='International';let g=0,q=0,n=0,wt=0,rows='';

  P.forEach((p,pi)=>{wt+=+p.wt||0;rows+=`<tr class="pkh"><td colspan="${cols}">Packet No. ${pi+1} (${[...new Set(p.items.map(i=>i.kind||'Box'))].join(' / ')})${p.dim?'&nbsp;&nbsp;&nbsp;&nbsp;Dimension: '+esc(p.dim):''}${p.wt?'&nbsp;&nbsp;&nbsp;&nbsp;Weight: '+esc(p.wt):''}</td></tr>`;
    p.items.forEach(it=>{n++;const a=(+it.qty||0)*(+it.rate||0);g+=a;q+=+it.qty||0;rows+=`<tr><td>${n}</td><td>${esc(it.prod)}</td><td>${esc(it.desc)}</td><td>${esc(it.hsn||'')}</td><td>${esc(it.qty)}</td>${intl?`<td>${esc(it.rate)}</td><td class="r">${money(a)}</td>`:''}</tr>`})});
  const head=intl?'<th style="width:5%;text-align:left">Sr</th><th style="width:17%">Product</th><th style="width:28%">Description</th><th style="width:10%">HSN</th><th style="width:8%">Qty</th><th style="width:9%">Rate</th><th style="width:23%">Taxable Value</th>'
                 :'<th style="width:6%;text-align:left">Sr</th><th style="width:26%">Product</th><th style="width:42%">Description</th><th style="width:14%">HSN</th><th style="width:12%">Qty</th>';

                 :`<div class="ft" style="grid-template-columns:1fr 1fr 1fr"><div>Total Qty: <b>${q}</b></div><div>Packets: <b>${P.length}</b></div><div class="r">Total weight: <b>${wt?+wt.toFixed(3):'–'}</b></div></div>`;
  const decl=intl?`<b>Declaration</b><br>${esc(FMT.declaration||'We declare that this Invoice shows actual price of the goods described and that all particulars are true and correct.').replace(/\n/g,'<br>')}${d.terms||d.incoterm?'<br>'+[d.terms,d.incoterm].filter(Boolean).map(x=>esc(x)).join(' | '):''}`

  <div class="two"><div class="l"><div class="cn">${esc(COMPANY.name)}</div>${COMPANY.lines.filter(x=>!/^[\s\d+()\-]{8,}$/.test(String(x).trim())).map(x=>esc(x)).join('<br>')}<br>Email: reception@rugscreation.com${d.sender_phone?'<br>Sender No.: <b>'+esc(d.sender_phone)+'</b>':''}</div>

   <div class="cons">GSTIN/UIN: <b>${esc(COMPANY.gstin)}</b><br><br>${intl?`IEC NUMBER: <b>${esc(COMPANY.iec)}</b><br><br>PAN NUMBER: <b>${esc(COMPANY.pan)}</b><br><br>`:''}Weight: <b>${wt?+wt.toFixed(3):''}</b></div></div>
  <table class="it"><thead><tr>${head}</tr></thead><tbody>${rows}<tr class="pp-sp"><td colspan="${cols}" style="height:8px"></td></tr></tbody></table>

async function fxCall(body){

}

/* ---------- no browser autofill pop-ups in forms ----------
   Chrome/Edge kept showing saved addresses, phones and old entries under the invoice boxes.
   Every text box gets autocomplete switched off; our own lists (countries, saved buyers,
   heading lines, city search) still work because they use <datalist> / our own dropdown. */
(function(){const AF=/^(b_|f_)/;
  function fix(root){const SEL='input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=hidden]):not([type=password]),textarea';const list=[...(root||document).querySelectorAll(SEL)];if(root&&root.matches&&root.matches(SEL))list.push(root);list.forEach(el=>{
    if(el.dataset.noaf)return;el.dataset.noaf='1';
    el.setAttribute('autocomplete',AF.test(el.id||'')?'rc-no-autofill':'off');
    el.setAttribute('autocorrect','off');el.setAttribute('autocapitalize',el.type==='email'?'none':'sentences');el.setAttribute('spellcheck','false');
    el.setAttribute('data-lpignore','true');el.setAttribute('data-1p-ignore','');el.setAttribute('data-form-type','other')})}
  new MutationObserver(m=>{for(const r of m)for(const n of r.addedNodes)if(n.nodeType===1)fix(n)}).observe(document.documentElement,{childList:true,subtree:true});
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>fix());else fix();
})();

function buyGroups(){const g={};const inRange=i=>(!ACC.from||(i.appr_at||'')>=ACC.from)&&(!ACC.to||(i.appr_at||'').slice(0,10)<=ACC.to);
  ACC.inv.filter(inRange).forEach(i=>{const k=buyerName(i)||'(no buyer name)';const x=g[k]||(g[k]={name:k,inv:[],bills:[],exp:0,est:0,kg:0});const c=compare(i);x.inv.push(Object.assign({inv:i},c));x.exp+=c.amt||0;if(!c.bs.length&&c.est&&!c.est.err)x.est+=c.est.total;x.kg+=c.bw||0;x.bills.push(...c.bs)});
  return Object.values(g).sort((a,b)=>b.exp-a.exp)}
function drawBuy(){const gs=buyGroups(),tot=gs.reduce((s,x)=>s+x.exp,0),tEst=gs.reduce((s,x)=>s+x.est,0),unm=ACC.bills.filter(b=>!ACC.inv.some(i=>awbKey(i.tracking_no)===b.awb_key));

  <div class="panel"><div class="row" style="margin-bottom:10px"><label class="note">From <input type="date" id="accFrom" value="${ACC.from}"></label><label class="note">To <input type="date" id="accTo" value="${ACC.to}"></label><button class="btn" data-ac="csv">Export Excel (CSV)</button></div>
  ${gs.length?`<div class="tbl"><table><thead><tr><th>Buyer</th><th>Invoices</th><th>Billed kg</th><th>Courier expense (billed)</th><th>Estimated (rate list)</th><th>Bills missing</th><th></th></tr></thead><tbody>${gs.map(x=>{const miss=x.inv.filter(i=>i.st==='nobill').length;return `<tr><td><b>${esc(x.name)}</b></td><td>${x.inv.length}</td><td>${+x.kg.toFixed(1)}</td><td>${x.inv.some(i=>i.bs.length)?'<b>'+inr2(x.exp)+'</b>':'<span class="note">no bill yet</span>'}</td><td>${x.est?inr2(x.est)+' <span class="note">est.</span>':x.inv.some(i=>i.st==='notrack')?'<span class="note">no tracking no.</span>':'-'}</td><td>${miss?`<span class="pill Rejected">${miss}</span>`:'0'}</td><td class="num"><button class="btn sm" data-ac="bx" data-k="${esc(x.name)}">${ACC.open[x.name]?'Hide':'Details'}</button></td></tr>${ACC.open[x.name]?`<tr><td colspan="7" style="background:#faf9f7"><table><tbody>${x.inv.map(i=>`<tr><td>${esc(i.inv.inv_no)}</td><td>${esc(i.inv.tracking_no||'-')}</td><td>${i.bs.length?inr2(i.amt)+' · '+i.bw+' kg':(i.est&&!i.est.err?'<span class="note">no bill · est. '+inr2(i.est.total)+'</span>':'<span class="note">'+(i.inv.tracking_no?'no bill':'no tracking no.')+'</span>')}</td><td>${i.issues.length?'<span style="color:#B42318;font-weight:700">&#9888; '+esc(i.issues[0])+'</span>':''}</td><td class="num">${i.bs.map(b=>b.file_id?`<button class="btn sm" data-ac="view" data-id="${b.file_id}">Bill</button>`:'').join(' ')}</td></tr>`).join('')}</tbody></table></td></tr>`:''}`}).join('')}</tbody></table></div>`:'<div class="empty">No approved invoices with tracking numbers yet.</div>'}</div>`;
  $('accFrom').onchange=e=>{ACC.from=e.target.value;drawBuy()};$('accTo').onchange=e=>{ACC.to=e.target.value;drawBuy()}}
function buyCsv(){const rows=[['Buyer','Invoices','Billed kg','Courier expense INR','Estimated INR (no bill)','Bills missing']].concat(buyGroups().map(x=>[x.name,x.inv.length,+x.kg.toFixed(1),Math.round(x.exp),Math.round(x.est),x.inv.filter(i=>i.st==='nobill').length]));

(function(){const c=$('sigC'),g=c.getContext('2d');let dn=false,lx=0,ly=0;const pos=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};

  <div class="panel"><h2>Approved by Admin</h2>${d.length?`<div class="tbl"><table><thead><tr><th>No.</th><th>Buyer</th><th>Approved by</th><th>When</th></tr></thead><tbody>${d.map(r=>`<tr><td><b>${esc(r.inv_no)}</b></td><td>${esc(buyerName(r))}</td><td>Admin (${esc(r.appr_admin)}) for ${esc(r.appr_name||'Preeti')}</td><td>${esc(r.appr_at?new Date(r.appr_at).toLocaleString('en-IN'):'')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">None yet.</div>'}</div>`};
/* ---- silent live refresh: no flash, no jump, never while the user is typing ---- */
(()=>{let busy=false,sig=null;
const typing=()=>{const a=document.activeElement;return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&$('main').contains(a)&&a.id!=='isrch')};
const modal=()=>!!document.querySelector('dialog[open]');
async function tick(){if(busy||document.hidden||typeof ME==='undefined'||!ME)return;busy=true;
 try{const a=await api('cd_inv_list');if(!a||!a.ok)return;const n=JSON.stringify(a.rows);if(sig===null){sig=JSON.stringify(rows);}
  if(n===sig)return;sig=n;rows=a.rows;nav();
  const safe=['home','inv','mytrack','appr'].includes(page)&&!(view&&(view.t==='form'||view.t==='detail'))&&!typing()&&!modal();
  if(!safe)return;
  const y=window.scrollY,ae=document.activeElement,id=ae&&ae.id,ss=ae&&ae.selectionStart;
  $('main').innerHTML=PAGES[page]();if(AFTER[page])AFTER[page]();window.scrollTo(0,y);
  if(id){const e=$(id);if(e){e.focus();try{e.setSelectionRange(ss,ss)}catch(_){}}}
 }catch(_){}finally{busy=false}}
setInterval(tick,10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});window.addEventListener('focus',tick);
})();
