<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rugs Email</title><script>/* 19 Nov 2026: slow-PC mode (server/patch-slow-pc.js) */(function(){var o=null;try{o=localStorage.getItem("rugs-slowpc")}catch(e){}var hc=navigator.hardwareConcurrency||8,dm=navigator.deviceMemory||8;window.SLOW_PC=o==="1"?true:o==="0"?false:(hc<=4||dm<=4);if(window.SLOW_PC){document.documentElement.classList.add("slowpc");var st=document.createElement("style");st.textContent=".slowpc *,.slowpc *::before,.slowpc *::after{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;transition-duration:0s!important}";document.head.appendChild(st)}})();</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: 3-pane mail client — app rail | folders + departments | message list | reading pane. Brand: Rugs Creation orange on ink */
:root{
  --bg:#f4f2f0; --pane:#ffffff; --pane2:#faf8f6; --fg:#191513; --muted:#6b645e; --line:#ebe6e1; --hover:#f6efe9;
  --brand:#ff5001; --brand2:#fff0e6; --brandfg:#c23d00; --ink:#111010;
  --red:#d92d20; --redbg:#fdecea; --amber:#b86e00; --amberbg:#fff4dc; --green:#1f8a4c; --greenbg:#e5f6ec; --blue:#2f6fe0; --bluebg:#e8f0fe; --violet:#7a3fd1; --violetbg:#f1e9fd;
  --shadow:0 12px 40px rgba(25,15,10,.18); --r:14px;
  --ui:"Plus Jakarta Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0c0c; --pane:#161414; --pane2:#1b1918; --fg:#f2eeeb; --muted:#9c948e; --line:#2a2624; --hover:#221e1c;
  --brand:#ff5a12; --brand2:#33190b; --brandfg:#ff8a52; --ink:#000;
  --red:#ff7b70; --redbg:#3a1714; --amber:#f2b442; --amberbg:#352712; --green:#5fd391; --greenbg:#13301f; --blue:#86aefc; --bluebg:#18243d; --violet:#c09bff; --violetbg:#271d3a;
  --shadow:0 12px 40px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0c0c; --pane:#161414; --pane2:#1b1918; --fg:#f2eeeb; --muted:#9c948e; --line:#2a2624; --hover:#221e1c;
  --brand:#ff5a12; --brand2:#33190b; --brandfg:#ff8a52; --ink:#000;
  --red:#ff7b70; --redbg:#3a1714; --amber:#f2b442; --amberbg:#352712; --green:#5fd391; --greenbg:#13301f; --blue:#86aefc; --bluebg:#18243d; --violet:#c09bff; --violetbg:#271d3a;
  --shadow:0 12px 40px rgba(0,0,0,.6); color-scheme:dark}
html,body{height:100%;margin:0}   /* 19 Nov 2026: the 8px default margin pushed the bottom of the app (now the status bar) off the screen */
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--ui);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.side{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}

/* top bar */
.top{background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding-block:8px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.logo img{height:28px;display:block}
.logo em{font-style:normal;color:var(--brand)}
.search{flex:1 1 260px;min-width:0;max-width:640px;margin-inline:auto;display:flex;align-items:center;gap:8px;background:#ffffff14;border:1px solid #ffffff22;border-radius:999px;padding:0 14px}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:#fff;padding:8px 0}
.search input::placeholder{color:#ffffff99}
.tb{display:flex;gap:6px;align-items:center}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;position:relative}
.ib:hover{background:#ffffff1a}
.dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--brand);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.me{display:flex;align-items:center;gap:8px;color:#fff;padding:4px 10px 4px 4px;border-radius:999px}
.me:hover{background:#ffffff1a}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;flex:none;position:relative}
.av.sm{width:22px;height:22px;font-size:9.5px}
.av .st{position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;border:2px solid var(--ink);background:#22c55e}
.av .st.away{background:#f59e0b}

/* shell */
.shell{flex:1;min-height:0;display:flex}
.rail{width:64px;flex:none;background:var(--pane2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:10px}
.rail button{width:48px;padding:7px 0;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);position:relative}
.rail button svg{width:20px;height:20px}
.rail button:hover{background:var(--hover);color:var(--fg)}
.rail button[aria-current="true"]{color:var(--brandfg);background:var(--brand2)}
.rail .n{position:absolute;top:2px;right:4px;background:var(--brand);color:#fff;font-size:9.5px;border-radius:8px;padding:0 5px;font-weight:700}

.folders{width:var(--wF,236px);flex:none;background:var(--pane2);border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:14px}
.newmail{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:#fff;font-weight:700;border-radius:12px;padding:10px;box-shadow:0 4px 14px color-mix(in srgb,var(--brand) 35%,transparent)}
.newmail:hover{filter:brightness(1.05)}
.newmail svg{width:18px;height:18px;flex:none}
.mpick{display:none;border:1px solid var(--line);background:var(--pane2);border-radius:10px;padding:7px 10px;font-weight:600}
.fab{display:none;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;background:var(--brand);color:#fff;font-size:24px;box-shadow:var(--shadow);z-index:20}
.fgroup{display:flex;flex-direction:column;gap:1px}
.fgroup h4{margin:0 0 4px;padding:0 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.fi{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;color:var(--fg);text-align:left;width:100%}
.fi:hover{background:var(--hover)}
.fi[aria-current="true"]{background:var(--brand2);color:var(--brandfg);font-weight:700}
.fi .ic{width:18px;text-align:center;flex:none;opacity:.85}
.fi .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi .c{font-size:12px;font-weight:700;color:var(--muted)}
.fi .c.hot{color:var(--brandfg)}
.fiw{position:relative}
.fdel{position:absolute;right:4px;top:3px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:14px;color:var(--muted);opacity:0}
.fdel:hover{background:var(--hover)}
.fi[aria-current="true"]+.fdel{color:var(--brandfg)}
.fiw:hover .fdel,.fiw:focus-within .fdel{opacity:1}
.fiw:hover .fi,.fiw:focus-within .fi{padding-right:36px}
@media (hover:none){.fdel{opacity:1}.fiw .fi{padding-right:36px}}
.ddot{width:9px;height:9px;border-radius:3px;flex:none}

/* list */
.list{width:var(--wL,400px);flex:none;background:var(--pane);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.lhead{padding:14px 16px 8px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.lhead h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.lhead h2 small{font-size:12px;color:var(--muted);font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--pane2);border:1px solid var(--line)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--pane);border-color:var(--fg)}
.chip .k{margin-left:4px;opacity:.75}
.msgs{flex:1;overflow-y:auto}
.day{padding:10px 16px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.m{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:11px 14px 11px 12px;border-left:3px solid transparent;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.m:hover{background:var(--hover)}
.m.open{background:var(--brand2);border-left-color:var(--brand)}
.m.unread{border-left-color:var(--brand)}
.m .body{min-width:0;display:flex;flex-direction:column;gap:2px}
.m .r1{display:flex;gap:8px;align-items:baseline}
.m .who{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.m.unread .who,.m.unread .sub{font-weight:800}
.m .time{font-size:12px;color:var(--muted);white-space:nowrap}
.m.unread .time{color:var(--brandfg);font-weight:700}
.m .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.m .pre{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;color:var(--muted)}
.m .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;align-items:center}
.qa{position:absolute;right:10px;top:8px;display:none;gap:2px;background:var(--pane);border:1px solid var(--line);border-radius:10px;padding:2px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.m:hover .qa{display:flex}
.qa button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:14px}
.qa button:hover{background:var(--hover)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.t-new{background:var(--bluebg);color:var(--blue)}.t-asg{background:var(--pane2);color:var(--muted);border:1px solid var(--line)}
.t-prom{background:var(--amberbg);color:var(--amber)}.t-late{background:var(--redbg);color:var(--red)}.t-done{background:var(--greenbg);color:var(--green)}
.t-xfer{background:var(--violetbg);color:var(--violet)}.t-flag{color:var(--red);font-size:13px}
.empty{padding:60px 24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{font-size:16px;color:var(--fg)}

/* reader */
.read{flex:1;min-width:0;background:var(--pane);display:flex;flex-direction:column;min-height:0}
.rtop{padding:16px 22px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.rtop h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.25;text-wrap:balance}
.rtitle{display:flex;gap:10px;align-items:flex-start}
.rtitle h1{flex:1;min-width:0}
.back{display:none;width:34px;height:34px;border-radius:10px;background:var(--pane2);flex:none}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;font-weight:600;font-size:13px;background:var(--pane2);border:1px solid var(--line)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.vio{background:var(--violetbg);color:var(--violet);border-color:transparent}
.btn.ok{background:var(--greenbg);color:var(--green);border-color:transparent}
.track{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--pane2);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:13px}
.track .k{color:var(--muted);font-size:12px;font-weight:600}
.track select{background:var(--pane);border:1px solid var(--line);border-radius:8px;padding:4px 8px;max-width:190px}
.track .sp{width:1px;height:20px;background:var(--line)}
.rbody{position:relative;flex:1;overflow-y:auto;padding:16px 22px 24px;display:flex;flex-direction:column;gap:0}
.promise{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--amberbg);border-radius:var(--r);padding:10px 12px}
.promise.late{background:var(--redbg)}
.promise b{flex:1 1 200px;min-width:0}
.promise .sub{font-size:12px;color:var(--muted)}
/* STEP 5: no cards - a thin header, a flowing body, a faint divider */
.mail{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 2px;display:flex;flex-direction:column;gap:10px;background:transparent}
.mail header{display:flex;gap:10px;align-items:center}
.mail header .w{flex:1;min-width:0}
.mail header .w b{display:block}
.mail header .w span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.mail header time{font-size:12px;color:var(--muted);white-space:nowrap}
.mail p{margin:0;white-space:pre-wrap;line-height:1.6}
.att{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;width:fit-content}
.inline{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.inline .to{padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.inline textarea{border:0;outline:none;resize:vertical;min-height:90px;padding:10px 12px;background:var(--pane);line-height:1.5}
.inline footer{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--pane2);border-top:1px solid var(--line)}
.inline footer .grow{flex:1}
.inline input[type=text],.inline input[type=date]{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--pane);min-width:0}
.hist{display:flex;flex-direction:column;gap:0;padding-left:6px}
.hist h5{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.hi{display:flex;gap:10px;font-size:12.5px;padding-bottom:10px;position:relative}
.hi::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--line);margin-top:4px;flex:none;box-shadow:0 0 0 3px var(--pane)}
.hi.h-r::before{background:var(--brand)}.hi.h-x::before{background:var(--violet)}.hi.h-a::before{background:var(--blue)}.hi.h-d::before{background:var(--green)}.hi.h-p::before{background:var(--amber)}
.hi span{color:var(--muted)}
.hi>div{min-width:0;flex:1;overflow-wrap:anywhere}
.rbody>*,.page>*,.folders>*,.dlg .body>*{flex-shrink:0}
.blank{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}
.blank img{height:56px;opacity:.9;margin:0 auto 12px;display:block;border-radius:10px}

/* pages (people, tasks, etc.) */
.page{flex:1;min-width:0;overflow-y:auto;background:var(--pane);padding:22px clamp(16px,3vw,32px) 40px;display:flex;flex-direction:column;gap:18px}
.page h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.page .lead{color:var(--muted);margin:-10px 0 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--pane)}
.card h3{margin:0;font-size:14px;display:flex;align-items:center;gap:8px}
.person{display:flex;gap:10px;align-items:center}
.person .w{flex:1;min-width:0}
.person .w b{display:block;font-size:13.5px}
.person .w span{font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.task .w{min-width:0}
.task .w b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .w span{font-size:12px;color:var(--muted)}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line)}
.tick:hover{border-color:var(--green);background:var(--greenbg)}
.feed{display:flex;flex-direction:column;gap:10px;max-width:760px}
.post{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.post span{font-size:12px;color:var(--muted)}
.post p{margin:0}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(10,8,6,.45);display:grid;place-items:center;z-index:50;padding:16px;backdrop-filter:blur(3px)}
.dlg{background:var(--pane);border-radius:18px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100% - 24px);display:flex;flex-direction:column;overflow:hidden}
.dlg.wide{width:min(760px,100%)}
.dlg header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg header h3{margin:0;font-size:16px;flex:1}
.dlg .body{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{width:32px;height:32px;border-radius:10px;background:var(--pane2)}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12px;font-weight:700;color:var(--muted)}
.dlg input[type=text],.dlg input[type=email],.dlg input[type=date],.dlg select,.dlg textarea{border:1px solid var(--line);background:var(--pane2);border-radius:10px;padding:8px 10px;width:100%;box-sizing:border-box;min-width:0}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dpick{border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px}
.dpick[aria-pressed="true"]{border-color:var(--violet);background:var(--violetbg)}
.dpick span{font-size:11.5px;color:var(--muted)}
.ai{display:flex;gap:6px}
.ai input{flex:1}
.editor{border:1px solid var(--line);border-radius:12px;min-height:170px;padding:10px 12px;line-height:1.55;outline:none;background:var(--pane)}
.pop{position:fixed;top:58px;right:12px;width:min(370px,calc(100% - 24px));background:var(--pane);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:40;max-height:72%;display:flex;flex-direction:column;overflow:hidden}
.pop header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.pop ul{list-style:none;margin:0;padding:0;overflow:auto}
.pop li{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;font-size:13px}
.pop li.un{background:var(--brand2)}
.pop li small{color:var(--muted)}
.menu button{display:flex;gap:10px;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
.menu button:hover{background:var(--hover)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--pane);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:60;box-shadow:var(--shadow);margin-bottom:env(safe-area-inset-bottom,0px)}
.mobnav{display:none}
[hidden]{display:none!important}

/* signature block */
.sig{border-left:3px solid var(--line);padding:4px 0 4px 12px;font-size:12.5px;color:var(--muted);white-space:pre-wrap;line-height:1.5}
.sig.ours{border-left-color:var(--brand)}
.sig small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:2px}
.via{display:inline-block;font-size:11px;font-weight:700;background:var(--brand2);color:var(--brandfg);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
/* dashboard */
.mbx{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#fff;background:#ffffff14;border:1px solid #ffffff22;border-radius:999px;padding:5px 10px;white-space:nowrap}
.mbx span{font-weight:500;opacity:.75}
@media (max-width:1100px){.mbx{display:none}}
body.signedout>header,body.signedout>.shell,body.signedout>.mobnav,body.signedout>.fab{visibility:hidden}

/* ===== audit fixes (contrast · motion · touch · phone) ===== */
:root{--brand-strong:#c2410c;--ease-out:cubic-bezier(.23,1,.32,1);--ease-io:cubic-bezier(.77,0,.175,1)}
[data-theme="dark"]{--brand-strong:#c2410c}

.btn.pri,.newmail,.fab,.lgbtn{background:var(--brand-strong);border-color:var(--brand-strong);color:#fff}
.newmail{box-shadow:0 4px 14px color-mix(in srgb,var(--brand-strong) 30%,transparent)}
.ico{width:15px;height:15px;flex:none;vertical-align:-3px}
.fi .ic .ico{width:16px;height:16px;vertical-align:0}
.tag .ico,.lb .ico{width:12px;height:12px;vertical-align:-2px}
/* coloured text: mix toward the text colour so it stays readable on tints (4.5:1) */
.lchip{color:color-mix(in srgb,var(--lc) 62%,var(--fg))}
.lchip[aria-pressed="true"]{background:color-mix(in srgb,var(--lc) 16%,var(--pane));color:var(--fg);border-color:var(--lc)}
.lb{color:color-mix(in srgb,var(--lc) 60%,var(--fg))}
.t-new{color:color-mix(in srgb,var(--blue) 75%,var(--fg))}.t-done{color:color-mix(in srgb,var(--green) 70%,var(--fg))}.t-late{color:color-mix(in srgb,var(--red) 80%,var(--fg))}.t-prom{color:color-mix(in srgb,var(--amber) 70%,var(--fg))}

/* the mail trail: every earlier mail in the conversation, newest first, as Outlook quotes it */
function trailOf(t,upto){const ms=t.msgs.slice(0,upto==null?t.msgs.length:upto);
 return ms.map(m=>({from:m.from,email:m.email,at:m.at,
  to:m.to||(m.by?t.email:dept(t.dept).box+'rugscreation.com'),cc:m.cc||'',
  sub:cleanSub(t.sub),body:m.body,sig:m.sig,html:qBody(m)}))}
/* ---------- quoting an earlier mail exactly as it came ----------
   The quote is that mail's OWN HTML: m.raw (what Gmail actually sent) or
   m.html (a mail we wrote here). Nothing is re-styled, so its fonts, colours,
   highlights, numbered lists, tables, pictures and signature stay as they
   were. Only what can run or fetch something is removed. */
const QC=new WeakMap();                       // one parse per message, not per redraw
function scopeCSS(css,sel){
 /* the mail's own <style> rules are kept, but every selector is prefixed with
    this quote's class so they cannot restyle the compose window or the app.
    The browser's own CSS parser does the work; @import (rule type 3) is simply
    never copied across. media="not all" means nothing is applied while we read it. */
 if(!css)return'';
 const st=document.createElement('style');st.media='not all';st.textContent=css;document.head.appendChild(st);
 const walk=rules=>{let s='';for(const r of rules){
   if(r.type===1)s+=String(r.selectorText||'').split(',').map(x=>sel+' '+x.trim()).join(',')+'{'+r.style.cssText+'}';
   else if(r.type===4)s+='@media '+r.conditionText+'{'+walk(r.cssRules)+'}';
   else if(r.type===12)s+='@supports '+r.conditionText+'{'+walk(r.cssRules)+'}';

/* shared lists (admin only): fetch the latest copy, merge item by item (3-way: what I last loaded → what I have now → what the server has now), then save */
const SHARED_MK={circulars:'__circ',cats:'__cats',rules:'__rules',blocked:'__blocked',templates:'__tpl',folders:'__fold'};
const SHARED_KEY={blocked:x=>String(x).toLowerCase(),templates:x=>String(x&&x.name||''),circulars:x=>(x&&x.by)+'|'+(x&&x.at),cats:x=>String(x&&(x.id||x.name)||''),folders:x=>String(x&&(x.id||x.name)||''),rules:x=>JSON.stringify([x&&x.from||'',x&&x.subject||'',x&&x.mailbox||''])};

 bm.forEach((x,id)=>{if(!mm.has(id)&&out.has(id)&&js(out.get(id))===js(x))out.delete(id)});   // I removed it (and nobody changed it since)
 mm.forEach((x,id)=>{const b=bm.get(id);if(!b||js(b)!==js(x))out.set(id,x)});                     // I added or changed it

/* ---------- opening a mail: the full original comes live from Gmail ----------
   The mail list only carries a 1500-character preview (the server trims
   body_text in its list query), so the whole mail is fetched by api('thread')
   the moment a conversation is opened. What used to leave a mail stuck on that
   preview, and what is done about it now:
     - the error was swallowed into a toast that disappeared after 3.5 seconds
       -> a PERMANENT bar in the reading pane with a Retry button
     - api() has no timeout, so a hung request waited for ever with nothing on
       screen -> 45-second limit, plus ONE automatic retry
     - nothing said the mail was still loading -> "Loading the full mail..." bar
     - t.full was set even when Gmail had not returned every message, and the
       guard at the top then blocked any further attempt -> t.full is set only
       when every message really arrived
     - the redraw was SKIPPED while the quick reply box had focus, so the full
       mail never appeared while typing -> redrawRead() keeps the typed text
       and the caret instead
     - a list refresh could drop the loaded mail back to the preview -> what
       loaded is kept for the whole session in RAWC, keyed by Gmail message id
   Loading state lives in LD (keyed by thread id), never on the thread object,
   so it is never written into the device copy or the browser cache. */

 if(o.cat&&!(t.cats||[]).some(c=>L(catOf(c)?.name).includes(o.cat)))return false;
 if(o.in&&!(t.folder===o.in||(o.in==='sent'&&t.msgs.some(m=>m.by||m.ours)&&(typeof sentSeen!=='function'||sentSeen(t)))))return false;

const REMOTE_RE=/\b(?:src|background|poster|srcset)\s*=\s*["']?\s*(?:https?:)?\/\/|url\(\s*["']?\s*(?:https?:)?\/\//i;
const PIC_CSP='<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; img-src data: blob: cid:; style-src \'unsafe-inline\'; font-src data:; media-src data: blob:">';
const picSenders=()=>Array.isArray(S.prefs&&S.prefs.picSenders)?S.prefs.picSenders:[];

const hasRemote=h=>REMOTE_RE.test(h||'');
/* Nov 2026: a link inside a received mail's own HTML (shown in the sandboxed
   "exactly as received" iframe) must always open as a real new browser tab,
   not try to navigate that tiny iframe in place - <base target="_blank">
   does this for every link regardless of whether the sender's own HTML set
   one, and the iframe's "allow-popups-to-escape-sandbox" lets it actually
   become a top-level tab. This runs for every raw mail, not just ones with
   blocked pictures - picHTML used to return early (unchanged) whenever
   there was nothing to block, which skipped it entirely. */
function picHTML(m,h){const BASE='<base target="_blank">';
 const block=!picsOk(m)&&hasRemote(h),inj=BASE+(block?PIC_CSP:'');
 const hd=h.match(/<head\b[^>]*>/i);if(hd)return h.replace(hd[0],hd[0]+inj);

/* 19 Nov 2026: a picture that has not arrived yet is an rmcid: link, which the browser draws as a
   broken-image icon - that is what "the signature is not showing" looked like. Until it arrives it
   is drawn as blank space (the mail keeps its own size and layout), and a picture written in the
   text as [cid:...] shows a small "picture loading" line instead of raw [rmcid:...] text.
   Display only: the links stay in the mail itself, so cidPaint still finds them. */
const PIXEL="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
/* 19 Nov 2026: a picture that has arrived is put into the mail ALREADY ON THE SCREEN - the tag that
   was waiting for it is given its real src where it stands (inside the sandboxed frame too), and a
   picture that was written in the text becomes a real <img>. Nothing is rebuilt, so the mail does not
   flicker and does not jump back to the top; the frame is re-measured so the mail still grows to fit. */
function cidLive(){
 let any=false;
 const fill=(doc)=>{let hit=false;
  doc.querySelectorAll('img[data-rmcid],span[data-rmcid]').forEach(el=>{
   const k=el.getAttribute('data-rmcid'),d=k&&CIDD[k];if(!d)return;
   if(el.tagName==='IMG'){el.setAttribute('src',d);el.removeAttribute('data-rmcid');el.style.display='';hit=true}
   else{const im=doc.createElement('img');im.setAttribute('src',d);im.alt='';im.style.maxWidth='100%';im.style.height='auto';
    if(el.parentNode)el.parentNode.replaceChild(im,el);hit=true}});
  return hit};
 try{if(fill(document))any=true}catch(e){}
 document.querySelectorAll('.raw iframe').forEach(f=>{try{const d=f.contentDocument;if(d&&fill(d))any=true}catch(e){}});
 if(any)try{setTimeout(fitFrames,60)}catch(e){}
 return any}

 if(h.indexOf("rmcid:")>=0){h=h.replace(CID_SRC,(m0,a,k,b)=>a+PIXEL+b+' data-rmcid="'+k+'"')
  .replace(CID_TXT,(m0,pre,k)=>pre+'<span data-rmcid="'+k+'" style="color:#9c948e;font-size:12px">⏳ picture loading…</span>')}

 (S.threads||[]).forEach(t=>{

  if(t.email)s.add(String(t.email).toLowerCase());
  (t.msgs||[]).forEach(m=>{if(!(m.by||m.ours))return;
   const hit=(String(m.to||'')+','+String(m.cc||'')).toLowerCase().match(/[\w.+-]+@[\w.-]+\.\w{2,}/g);

     - anyone we have replied to or written to                -> yes

const colleagueIn=(m,t)=>!!m&&m.ours&&!m.by&&!!m.email&&String(m.email).toLowerCase()!==String(t.box||'').toLowerCase();

   mail you send to your own address, or any mail with this mailbox in To/Cc. Gmail shows such a mail
   in both Inbox and Sent, and now Rugs Email does too. Mail sent to a buyer is untouched. */
const toThisBox=(m,t)=>{const b=String((t&&t.box)||'').toLowerCase();return !!b&&!!m&&((String(m.to||'')+' '+String(m.cc||'')).toLowerCase().includes(b))};
const recvMsg=(m,t)=>!(m.by||m.ours)||colleagueIn(m,t)||toThisBox(m,t);

    conversation belongs to the Inbox (it is the same conversation, with our mail inside it). */
 if(view.type==='box'&&t.dept===view.dept&&view.folder==='sent')return t.folder!=='deleted'&&t.msgs.some(m=>m.by||(m.ours&&!colleagueIn(m,t)))&&!recvLast(t);   /* 20 Nov 2026: ours is the last word */

const addrOf=s=>(String(s||'').match(/[\w.+-]+@[\w.-]+\.\w+/)||[''])[0].toLowerCase();
function nameOf(one){
 const em=addrOf(one);
 const disp=String(one||'').replace(/<[^>]*>/g,'').replace(/["']/g,'').trim();
 if(em){
  const p=(PEOPLE||[]).find(x=>String(x.login||'').toLowerCase()===em
   ||String((x.perm&&x.perm.aliases)||'').toLowerCase().split(/[\s,;]+/).filter(Boolean).indexOf(em)>=0);
  if(p)return p.name;
  const d=(DEPTS||[]).find(x=>String(mailOf(x)||'').toLowerCase()===em);
  if(d)return d.name;
 }
 return disp||em}

 .filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join('; ');

/* ---------- STEP 6 (18 Nov 2026): Empty Junk / Empty Deleted ----------
   Outlook has it on the folder itself, so the button sits on the Junk and
   Deleted rows of the folder pane (same look as the delete button on a
   personal folder). Only someone allowed to delete mail sees it.
     Junk    -> everything moves to Deleted, exactly like the per-mail Delete.
     Deleted -> everything leaves Rugs Email's folders (folder 'purged') and is
                marked done and read. The mail itself is NOT destroyed: Delete
                already moved the Gmail copy to Gmail Trash and Google clears
                that after 30 days, so this empties our view, not the mailbox.
   Both ask first and give 10 seconds of Undo. */
function emptyFolder(boxId,f){
 const list=S.threads.filter(t=>t.dept===boxId&&t.folder===f);
 if(!list.length){toast(f==='junk'?'Junk is already empty':'Deleted is already empty');return}
 const name=f==='junk'?'Junk':'Deleted';
 const n=list.length;
 const what=f==='junk'
  ? '<p style="margin:0 0 8px">Move <b>'+n+' conversation'+(n>1?'s':'')+'</b> out of '+name+' into Deleted?</p>'
    +'<p class="lead" style="margin:0">That is the same as pressing Delete on each one. The originals stay in the company mailbox.</p>'
  : '<p style="margin:0 0 8px">Empty <b>'+name+'</b> — '+n+' conversation'+(n>1?'s':'')+'?</p>'
    +'<p class="lead" style="margin:0">They leave Rugs Email and stop counting as work. The mail itself is already in Gmail Trash, which Google clears after 30 days, so nothing is destroyed here.</p>';
 const L=dlg('\u{1f5d1} Empty '+name,what,
  '<button class="btn" data-c>Cancel</button><button class="btn pri" data-ok>Empty '+name+'</button>');
 L.querySelector('[data-c]').onclick=()=>{L.innerHTML=''};
 L.querySelector('[data-ok]').onclick=()=>{
  L.innerHTML='';
  const back=list.map(t=>({t,folder:t.folder,prev:t.prev,status:t.status,unread:t.unread}));
  list.forEach(t=>{
   t.prev=t.folder;
   if(f==='junk'){t.folder='deleted'}
   else{t.folder='purged';t.status='done';t.unread=false}
   hist(t,'n',(f==='junk'?'Moved to Deleted by ':'Removed from Rugs Email by ')+who(ME).name+' (emptied '+name+')')});
  if(openId&&list.some(t=>t.id===openId))openId=null;
  save();render();
  undoToast(name+' emptied · '+n+' conversation'+(n>1?'s':''),()=>{
   back.forEach(b=>{b.t.folder=b.folder;b.t.prev=b.prev;b.t.status=b.status;b.t.unread=b.unread});
   save();render()})}}

/* ================= 16 Nov 2026: a mail with an owner is that person's mail =================
   Mail nobody has taken is shown to the WHOLE team, so anyone can pick it up ("Needs owner").
   The moment it has an owner — someone replied, took it, or a rule gave it to them — it becomes
   their mail: the other members of the team stop seeing it in their lists and counts, while the
   team's manager, the CRM and the admin keep seeing everything in the team.
   A conversation you replied in stays visible to you even after it is handed to someone else, so
   work you have already done never disappears from your side.
   Handing over (Assign to…) needs no copying: it is the same conversation, so the new owner opens
   it with every earlier mail and the whole trail, and it lands in their "My work".
   NOTE this hides mail from a colleague's screen; it is not a lock. The server still sends the
   team's mail to the team's own people, and Search follows the same rule. */

<script>
/* ===================== 17 Nov 2026: the Sent folder is personal too =====================
   A shared team mailbox (teamalpha@, teampulse@ ...) has ONE Sent folder on Google's side,
   so everybody used to see everybody's sent mail in it. Now a team member sees in Sent only
   the mail HE sent, the same way the Inbox already works (seeMine). The team's manager, the
   CRM and the admin still see everything the mailbox sent.
   "Mine" means: sent from Rugs Email by me, or sent from Outlook / Gmail under my own name,
   or sent from one of my own addresses (my user id plus the aliases in Admin -> Users).
   A mail sent from the mailbox under a name that belongs to nobody (e.g. "team alpha") cannot
   be traced to a person, so it stays visible to the whole team - nothing goes missing.
   This is the LAST layer over inView on purpose; an earlier layer would be bypassed. */
function nmKey(s){return String(s||'').toLowerCase().replace(/[^a-z\s]+/g,' ').trim().split(/\s+/)
 .filter(Boolean).map(w=>{const y=w.replace(/(.)\1+/g,'$1');return y[0]+y.slice(1).replace(/[aeiou]/g,'')})
 .filter(Boolean)}                      /* Jagjeet = Jagjit, Gulaab = Gulab, GULAB TYAGI = Gulab Tyagi */
function sentWho(m,t){                   /* which person sent this message, or null if we cannot tell */
 if(!m)return null;
 if(m.by)return m.by;                    /* sent from Rugs Email */
 if(!m.ours)return null;                 /* came from outside */
 const e=String(m.email||'').toLowerCase();
 if(e){const byMail=PEOPLE.find(p=>p.active!==false&&(String(p.login||'').toLowerCase()===e||
   String((p.perm&&p.perm.aliases)||'').toLowerCase().split(/[\s,;]+/).includes(e)));
  if(byMail)return byMail.id}
 const k=nmKey(m.fname||m.from);if(!k.length)return null;
 const pool=PEOPLE.filter(p=>p.active!==false&&(!t||!t.dept||p.dept===t.dept));
 let hit=pool.filter(p=>nmKey(p.name).join(' ')===k.join(' '));
 if(hit.length===1)return hit[0].id;
 if(k.length===1){hit=pool.filter(p=>nmKey(p.name)[0]===k[0]);if(hit.length===1)return hit[0].id}
 if(k.length>1){hit=PEOPLE.filter(p=>p.active!==false&&nmKey(p.name).join(' ')===k.join(' '));
  if(hit.length===1)return hit[0].id}        /* a full name from another team (someone with access to this mailbox) */
 return null}
function msgMine(m,t){return !!m&&(m.by?m.by===ME:sentWho(m,t)===ME)}
function sentSeen(t){const p=who(ME);
 if(!p||!t)return true;
 if(p.role==='Admin'||['Manager','Lead','CRM'].includes(p.role))return true;
 const out=(t.msgs||[]).filter(m=>m.by||(m.ours&&!colleagueIn(m,t)));
 if(!out.length)return true;             /* nothing was sent from this mailbox */
 if(out.some(m=>msgMine(m,t)))return true;  /* I sent one of them */
 return !out.some(m=>sentWho(m,t))}      /* nobody can be named: leave it with the whole team */
const _ivSent=inView;inView=function(t){
 if(t&&view&&view.type==='box'&&view.folder==='sent'&&t.dept===view.dept&&!sentSeen(t))return false;
 return _ivSent.apply(this,arguments)};
</script>
<script>/* __olpack:start */
/* Rugs Email - Outlook pack  (marker: __olpack)
   ---------------------------------------------------------------------------
   One extra layer on top of the mail app that lives in index.html as
   EMAIL_HTML_B64. It never edits the app's own code: it wraps rowHTML,
   renderFolders, _renderRead, renderTop, compose and cmOpen, so the app can be
   rebuilt underneath and this pack simply re-applied on top.

   To change it: edit THIS file, then run  python server/patch-outlook-pack.py
   (it replaces the block between the __olpack markers inside index.html).

   What it adds
     1  hover bar on each mail row: Mark read / unread, Pin, Not junk
     2  Search options dialog + saved searches in the folder pane
     3  favourite folders + Manage folders (rename / delete / star)
     4  Not junk (hover bar and right-click menu)
     5  Unsubscribe bar on newsletters
     6  Download all attachments of a conversation as one ZIP
     7  Read aloud
     8  Immersive reader
     9  Quick steps (ready-made and your own)
    10  pre-send check (no subject, "attached" with no file, many recipients)
   --------------------------------------------------------------------------- */
(function () {
  if (window.__olpack) return;
  window.__olpack = '1';
  const Q = s => document.querySelector(s);
  const pref = k => (S.prefs || {})[k];
  const setPref = (k, v) => {

  };
  const myName = () => (who(ME) || {}).name || 'someone';
  const openT = () => (typeof openId !== 'undefined' && openId ? T_(openId) : null);
  const full = t => canSee(t.dept) === 'full';

  /* ---------- styles ---------- */

    '.olbar button:hover{background:var(--hover)}',
    '.olbar button[disabled]{opacity:.5;cursor:default}',
    '.olbar .olnote{font-size:12px;color:var(--muted)}',
    '.olunsub{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:7px 10px;margin:8px 10px 0;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--blue,#0f6cbd) 7%,transparent);font-size:12.5px}',
    '.olstar{all:unset;cursor:pointer;padding:0 6px;opacity:.5;font-size:12px}',
    '.olstar:hover,.olstar.on{opacity:1}',
    '.olsq{display:grid;gap:8px}',
    '.olsq .row{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:7px 10px}',
    '.olsq .row small{color:var(--muted)}',
    '.olgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}',
    '@media(max-width:620px){.olgrid{grid-template-columns:1fr}}',
    '.olchk{display:flex;gap:8px;align-items:center;font-size:13px;margin:2px 0}',
    '.olimm{position:fixed;inset:0;z-index:9999;overflow:auto;padding:28px 18px 60px;background:#fbf8f3;color:#1d1d1d}',
    '.olimm.dark{background:#17181a;color:#e9e9ea}.olimm.sepia{background:#f4ecd8;color:#3a2f1b}',
    '.olimm .wrap{margin:0 auto}',
    '.olimm h1{font-size:1.35em;margin:0 0 4px}',
    '.olimm .meta{font-size:.8em;opacity:.7;margin-bottom:18px}',
    '.olimm .msg{margin:0 0 26px;white-space:pre-wrap;overflow-wrap:anywhere}',
    '.olimm .msg b.who{display:block;font-size:.8em;opacity:.75;margin-bottom:6px}',

    '.olimmbar button{all:unset;cursor:pointer;font:inherit;font-size:12.5px;padding:5px 10px;border:1px solid rgba(128,128,128,.4);border-radius:6px}',
    '.olwarn{margin:0 14px 10px;padding:8px 10px;border:1px solid color-mix(in srgb,var(--red,#d33) 45%,transparent);background:color-mix(in srgb,var(--red,#d33) 10%,transparent);border-radius:8px;font-size:12.5px}',
    '.olwarn ul{margin:4px 0 6px;padding-left:18px}',
    '.olwarn .act{display:flex;gap:8px;flex-wrap:wrap}'
  ].join('');
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);

  /* =======================================================================
     1 - hover bar: Mark read / unread, Pin, Not junk
     ======================================================================= */
  const _rowOL = rowHTML;
  rowHTML = function (t) {
    const h = _rowOL.apply(this, arguments);
    let b = '<button data-olrd="' + t.id + '" class="' + (t.unread ? 'on' : '') + '" title="' +
      (t.unread ? 'Mark read' : 'Mark unread') + '" aria-label="' + (t.unread ? 'Mark read' : 'Mark unread') + '">' +
      ico('mail') + '</button>' +
      '<button data-olpn="' + t.id + '" class="' + (t.pinned ? 'on' : '') + '" title="' +
      (t.pinned ? 'Unpin' : 'Pin to the top') + '" aria-label="Pin">' + ico('pin') + '</button>';
    if (t.folder === 'junk') b += '<button data-olnj="' + t.id + '" title="Not junk - move back to the Inbox" aria-label="Not junk">&#10003;</button>';
    return h.replace('<div class="qa">', '<div class="qa">' + b);
  };

  function notJunk(t) {
    const em = String(t.email || '').toLowerCase();
    const blocked = (S.blocked || []).map(x => String(x).toLowerCase());
    const onList = !!em && blocked.includes(em);
    const admin = (who(ME) || {}).role === 'Admin';
    let msg = 'Move this back to the Inbox as "not junk"?';
    if (onList) msg += admin
      ? ' ' + em + ' will also be taken off the team\'s blocked list.'
      : ' Note: ' + em + ' is on the team\'s blocked list, so their next mail will land in Junk again - ask an admin to unblock them.';
    rcAsk(msg, () => {
      t.folder = 'inbox'; t.prev = null;
      if (typeof reopenMail === 'function' && t.status === 'done' && !t.doneAt) reopenMail(t);
      hist(t, 'n', 'Marked not junk by ' + myName());
      if (onList && admin) S.blocked = (S.blocked || []).filter(x => String(x).toLowerCase() !== em);
      save(); toast('Moved to the Inbox'); render();
    });
  }

  /* =======================================================================
     2 - Search options + saved searches
     ======================================================================= */
  function runQ(q) {
    const i = Q('#q'); if (!i) return;
    if (typeof app !== 'undefined') app = 'mail';
    i.value = q;
    i.dispatchEvent(new Event('input', { bubbles: true }));
    try { render(); } catch (e) {}
  }
  function searchDlg() {
    const folders = [['', 'Any folder'], ['inbox', 'Inbox'], ['sent', 'Sent'], ['archive', 'Archive'],
      ['junk', 'Junk'], ['deleted', 'Deleted']].concat(myFolders().map(f => [f, f]));
    const L = dlg('Search options',
      '<div class="olgrid">' +
      '<div class="fld"><label for="olw">Words anywhere</label><input type="text" id="olw" placeholder="e.g. invoice 4050"></div>' +
      '<div class="fld"><label for="olfrom">From</label><input type="text" id="olfrom" placeholder="name or e-mail"></div>' +
      '<div class="fld"><label for="olto">To / Cc</label><input type="text" id="olto" placeholder="name or e-mail"></div>' +
      '<div class="fld"><label for="olsubject">Subject has</label><input type="text" id="olsubject" placeholder="words in the subject"></div>' +
      '<div class="fld"><label for="olin">Folder</label><select id="olin">' +
      folders.map(f => '<option value="' + esc(f[0]) + '">' + esc(f[1]) + '</option>').join('') + '</select></div>' +
      '<div class="fld"><label for="olaf">Received after</label><input type="date" id="olaf"></div>' +
      '<div class="fld"><label for="olbf">Received before</label><input type="date" id="olbf"></div>' +
      '<div class="fld"><label>Only show</label>' +
      '<label class="olchk"><input type="checkbox" id="olatt"> Mail with attachments</label>' +
      '<label class="olchk"><input type="checkbox" id="olun"> Unread</label>' +
      '<label class="olchk"><input type="checkbox" id="olfl"> Flagged</label></div></div>' +
      '<p class="lead" style="margin:10px 0 0">This writes the search for you. You can also type it by hand, e.g. ' +
      '<code>from:ikea subject:"ship date" has:attachment</code></p>',
      '<button class="btn" data-c>Cancel</button><button class="btn" data-olsv>Save this search</button>' +
      '<button class="btn pri" data-olsgo>Search</button>', true);
    const g = id => { const el = L.querySelector(id); return el ? String(el.value || '').trim() : ''; };
    const ck = id => { const el = L.querySelector(id); return !!(el && el.checked); };
    const build = () => {
      const out = [];
      if (g('#olw')) out.push(g('#olw'));
      ['from', 'to', 'subject'].forEach(k => {
        const v = g('#ol' + k);
        if (v) out.push(k + ':' + (/\s/.test(v) ? '"' + v + '"' : v));
      });
      if (g('#olin')) out.push('in:' + g('#olin'));
      if (ck('#olatt')) out.push('has:attachment');
      if (ck('#olun')) out.push('is:unread');
      if (ck('#olfl')) out.push('is:flagged');
      if (g('#olaf')) out.push('after:' + g('#olaf'));
      if (g('#olbf')) out.push('before:' + g('#olbf'));

    L.querySelector('[data-c]').onclick = () => { L.innerHTML = ''; };

       favourite-folder rows, whose handler would swallow the click. */

  /* =======================================================================
     5 - Unsubscribe
     ======================================================================= */
  const UNSUB_RX = /unsubscribe|opt[\s-]?out|stop these e?-?mails|manage (your )?(e?-?mail )?preferences/i;
  function unsubLink(t) {
    const ms = (t && t.msgs) || [];
    for (let i = ms.length - 1; i >= 0; i--) {
      const m = ms[i];
      if (!m || m.by || m.ours) continue;
      if (m.listUnsub && /^https?:/i.test(String(m.listUnsub))) return String(m.listUnsub);
      const html = String(m.raw || m.html || '');
      const rx = /<a\b[^>]*href\s*=\s*["']([^"']+)["'][^>]*>([\s\S]{0,300}?)<\/a>/gi;
      let a;
      while ((a = rx.exec(html))) {
        const href = a[1];
        const txt = String(a[2]).replace(/<[^>]*>/g, ' ');
        if (!/^https?:/i.test(href)) continue;
        if (UNSUB_RX.test(txt) || UNSUB_RX.test(href)) return href;
      }
      const u = String(m.body || '').match(/https?:\/\/\S*(unsubscribe|optout|opt-out)\S*/i);
      if (u) return u[0];
    }
    return '';
  }

  /* =======================================================================
     6 - Download all attachments as one ZIP
     ======================================================================= */
  function attsOf(t) {
    const out = [];
    ((t && t.msgs) || []).forEach(m => {
      ((m && m.atts) || []).forEach(a => { if (a && a.name && m.gid) out.push({ name: a.name, gid: m.gid }); });
    });
    return out;
  }
  function zipAll(t, btn) {
    const list = attsOf(t);
    if (!list.length) { toast('No attachments in this conversation'); return; }
    const was = btn ? btn.innerHTML : '';
    const say = s => { if (btn) btn.textContent = s; };
    if (btn) btn.disabled = true;
    const bad = [];
    const used = {};
    say('Getting the viewer...');
    loadJS(OFX.jszip).then(() => {
      const zip = new JSZip();
      let i = 0;
      const next = () => {
        if (i >= list.length) {
          if (!Object.keys(zip.files).length) throw new Error('None of the files could be fetched');
          say('Making the ZIP...');
          return zip.generateAsync({ type: 'blob' }).then(blob => {
            // 18 Nov 2026: the ZIP keeps the subject's own letters (Hindi, accents...) - only characters
            // Windows forbids are replaced - and goes through the app's one saveFile().
            const nm = fileName(String(cleanSub(t.sub) || 'attachments').slice(0, 60)) || 'attachments';
            saveFile(blob, nm + '.zip', 'application/zip');
            toast(bad.length ? 'ZIP saved - these could not be fetched: ' + bad.join(', ') : 'ZIP saved');
          });
        }
        const it = list[i++];
        say('Getting file ' + i + ' of ' + list.length + '...');
        return api('attachment', { mailbox: t.box, gmailId: it.gid, name: it.name })
          .then(r => {
            let nm = it.name || ('file' + i);
            if (used[nm]) {
              const d = nm.lastIndexOf('.');
              nm = d > 0 ? nm.slice(0, d) + ' (' + used[nm] + ')' + nm.slice(d) : nm + ' (' + used[nm] + ')';
            }
            used[it.name] = (used[it.name] || 0) + 1;
            zip.file(nm, r.b64 || '', { base64: true });
          })
          .catch(() => { bad.push(it.name); })
          .then(next);
      };
      return next();
    }).catch(e => {
      toast('Could not make the ZIP - ' + ((e && e.message) || 'try again'));
    }).then(() => {
      if (btn) { btn.disabled = false; btn.innerHTML = was; }
    });
  }

  /* =======================================================================
     7 - Read aloud
     ======================================================================= */
  let speaking = false;
  function readAloud(t, btn) {
    const synth = window.speechSynthesis;
    if (!synth) { toast('This browser cannot read mail aloud'); return; }
    if (speaking) { synth.cancel(); speaking = false; if (btn) btn.textContent = 'Read aloud'; return; }
    const ms = t.msgs || [];
    const last = ms[ms.length - 1];
    const body = String((last && last.body) || '').replace(/\s+/g, ' ').trim();
    const txt = (cleanSub(t.sub) || 'No subject') + '. From ' + (rowName(t) || 'unknown') + '. ' + (body || 'This mail has no text.');
    const u = new SpeechSynthesisUtterance(txt.slice(0, 7000));
    const voices = synth.getVoices() || [];
    const v = voices.filter(x => /en[-_]IN/i.test(x.lang))[0] || voices.filter(x => /^en/i.test(x.lang))[0];
    if (v) u.voice = v;
    u.onend = u.onerror = () => { speaking = false; if (btn) btn.textContent = 'Read aloud'; };
    speaking = true;
    if (btn) btn.textContent = 'Stop reading';
    synth.cancel(); synth.speak(u);
  }

  const qsList = () => {

  function qsRun(step, list) {
    let n = 0, skipped = 0;
    list.forEach(t => {
      if (!t) return;
      if (!full(t)) { skipped++; return; }
      (step.acts || []).forEach(a => {
        if (a === 'done') { t.status = 'done'; t.doneAt = t.doneAt || Date.now(); }
        else if (a === 'open') { if (typeof reopenMail === 'function') reopenMail(t); else t.status = t.owner ? 'open' : 'new'; }
        else if (a === 'read') t.unread = false;
        else if (a === 'unread') t.unread = true;
        else if (a === 'flag') t.flag = true;
        else if (a === 'unflag') t.flag = false;
        else if (a === 'pin') t.pinned = true;
        else if (a === 'mine') { t.owner = ME; if (t.status === 'new') t.status = 'open'; }
        else if (a === 'archive' || a === 'inbox' || a === 'junk') t.folder = a;
        else if (a === 'del') { if (can('delete')) { t.prev = t.folder; t.folder = 'deleted'; } }
        else if (a.indexOf('to:') === 0) t.folder = a.slice(3);
      });
      hist(t, 'n', 'Quick step "' + step.name + '" by ' + myName());
      n++;
    });
    save();
    toast(step.name + ' - ' + n + ' mail' + (n === 1 ? '' : 's') + (skipped ? ' (' + skipped + ' skipped, view only)' : ''));

    if (d.olunsub !== undefined) {
      const t = openT(); if (!t) return;
      const u = unsubLink(t);
      if (!u) { toast('No unsubscribe link found in this mail'); return; }
      rcAsk('Open the sender\'s unsubscribe page in a new tab? ' + u.slice(0, 120), () => {
        window.open(u, '_blank', 'noopener');
        hist(t, 'n', 'Unsubscribe page opened by ' + myName()); save();
      });
      return;
    }
  }, true);

  /* a search-options button next to the search box */
  const _rtOL = renderTop;
  renderTop = function () {
    const r = _rtOL.apply(this, arguments);
    try {
      const q = Q('#q');
      if (q && q.parentNode && !q.parentNode.querySelector('[data-olsearch]')) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'btn';
        b.dataset.olsearch = '1';
        b.title = 'Search options';
        b.setAttribute('aria-label', 'Search options');
        b.textContent = 'Options';
        b.style.cssText = 'padding:4px 8px;font-size:12px';
        q.after(b);
      }
    } catch (e) {}
    return r;
  };

  window.__olpackApi = { searchDlg, qsDlg, qsRun, qsList, immersive, readAloud, zipAll, attsOf, unsubLink, notJunk, preSendWarnings, favToggle, favList, manageFoldersDlg };
})();
