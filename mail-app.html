<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rugs Email</title><script>/* 19 Nov 2026: slow-PC mode (server/patch-slow-pc.js) */(function(){var o=null;try{o=localStorage.getItem("rugs-slowpc")}catch(e){}var hc=navigator.hardwareConcurrency||8,dm=navigator.deviceMemory||8;window.SLOW_PC=o==="1"?true:o==="0"?false:(hc<=4||dm<=4);if(window.SLOW_PC){document.documentElement.classList.add("slowpc");var st=document.createElement("style");st.textContent=".slowpc *,.slowpc *::before,.slowpc *::after{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;transition-duration:0s!important}";document.head.appendChild(st)}})();</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: 3-pane mail client — app rail | folders + departments | message list | reading pane. Brand: Rugs Creation orange on ink */
:root{
  --bg:#f4f2f0; --pane:#ffffff; --pane2:#faf8f6; --fg:#191513; --muted:#6b645e; --line:#ebe6e1; --hover:#f6efe9;
  --brand:#ff5001; --brand2:#fff0e6; --brandfg:#c23d00; --ink:#111010;
  --red:#d92d20; --redbg:#fdecea; --amber:#b86e00; --amberbg:#fff4dc; --green:#1f8a4c; --greenbg:#e5f6ec; --blue:#2f6fe0; --bluebg:#e8f0fe; --violet:#7a3fd1; --violetbg:#f1e9fd;
  --shadow:0 12px 40px rgba(25,15,10,.18); --r:14px;
  --ui:"Plus Jakarta Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0c0c; --pane:#161414; --pane2:#1b1918; --fg:#f2eeeb; --muted:#9c948e; --line:#2a2624; --hover:#221e1c;
  --brand:#ff5a12; --brand2:#33190b; --brandfg:#ff8a52; --ink:#000;
  --red:#ff7b70; --redbg:#3a1714; --amber:#f2b442; --amberbg:#352712; --green:#5fd391; --greenbg:#13301f; --blue:#86aefc; --bluebg:#18243d; --violet:#c09bff; --violetbg:#271d3a;
  --shadow:0 12px 40px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0c0c; --pane:#161414; --pane2:#1b1918; --fg:#f2eeeb; --muted:#9c948e; --line:#2a2624; --hover:#221e1c;
  --brand:#ff5a12; --brand2:#33190b; --brandfg:#ff8a52; --ink:#000;
  --red:#ff7b70; --redbg:#3a1714; --amber:#f2b442; --amberbg:#352712; --green:#5fd391; --greenbg:#13301f; --blue:#86aefc; --bluebg:#18243d; --violet:#c09bff; --violetbg:#271d3a;
  --shadow:0 12px 40px rgba(0,0,0,.6); color-scheme:dark}
html,body{height:100%;margin:0}   /* 19 Nov 2026: the 8px default margin pushed the bottom of the app (now the status bar) off the screen */
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--ui);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.side{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}

/* top bar */
.top{background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding-block:8px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.logo img{height:28px;display:block}
.logo em{font-style:normal;color:var(--brand)}
.search{flex:1 1 260px;min-width:0;max-width:640px;margin-inline:auto;display:flex;align-items:center;gap:8px;background:#ffffff14;border:1px solid #ffffff22;border-radius:999px;padding:0 14px}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:#fff;padding:8px 0}
.search input::placeholder{color:#ffffff99}
.tb{display:flex;gap:6px;align-items:center}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;position:relative}
.ib:hover{background:#ffffff1a}
.dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--brand);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.me{display:flex;align-items:center;gap:8px;color:#fff;padding:4px 10px 4px 4px;border-radius:999px}
.me:hover{background:#ffffff1a}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;flex:none;position:relative}
.av.sm{width:22px;height:22px;font-size:9.5px}
.av .st{position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;border:2px solid var(--ink);background:#22c55e}
.av .st.away{background:#f59e0b}

/* shell */
.shell{flex:1;min-height:0;display:flex}
.rail{width:64px;flex:none;background:var(--pane2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:10px}
.rail button{width:48px;padding:7px 0;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);position:relative}
.rail button svg{width:20px;height:20px}
.rail button:hover{background:var(--hover);color:var(--fg)}
.rail button[aria-current="true"]{color:var(--brandfg);background:var(--brand2)}
.rail .n{position:absolute;top:2px;right:4px;background:var(--brand);color:#fff;font-size:9.5px;border-radius:8px;padding:0 5px;font-weight:700}

.folders{width:var(--wF,236px);flex:none;background:var(--pane2);border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:14px}
.newmail{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:#fff;font-weight:700;border-radius:12px;padding:10px;box-shadow:0 4px 14px color-mix(in srgb,var(--brand) 35%,transparent)}
.newmail:hover{filter:brightness(1.05)}
.newmail svg{width:18px;height:18px;flex:none}
.mpick{display:none;border:1px solid var(--line);background:var(--pane2);border-radius:10px;padding:7px 10px;font-weight:600}
.fab{display:none;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;background:var(--brand);color:#fff;font-size:24px;box-shadow:var(--shadow);z-index:20}
.fgroup{display:flex;flex-direction:column;gap:1px}
.fgroup h4{margin:0 0 4px;padding:0 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.fi{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;color:var(--fg);text-align:left;width:100%}
.fi:hover{background:var(--hover)}
.fi[aria-current="true"]{background:var(--brand2);color:var(--brandfg);font-weight:700}
.fi .ic{width:18px;text-align:center;flex:none;opacity:.85}
.fi .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi .c{font-size:12px;font-weight:700;color:var(--muted)}
.fi .c.hot{color:var(--brandfg)}
.fiw{position:relative}
.fdel{position:absolute;right:4px;top:3px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:14px;color:var(--muted);opacity:0}
.fdel:hover{background:var(--hover)}
.fi[aria-current="true"]+.fdel{color:var(--brandfg)}
.fiw:hover .fdel,.fiw:focus-within .fdel{opacity:1}
.fiw:hover .fi,.fiw:focus-within .fi{padding-right:36px}
@media (hover:none){.fdel{opacity:1}.fiw .fi{padding-right:36px}}
.ddot{width:9px;height:9px;border-radius:3px;flex:none}

/* list */
.list{width:var(--wL,400px);flex:none;background:var(--pane);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.lhead{padding:14px 16px 8px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.lhead h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.lhead h2 small{font-size:12px;color:var(--muted);font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--pane2);border:1px solid var(--line)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--pane);border-color:var(--fg)}
.chip .k{margin-left:4px;opacity:.75}
.msgs{flex:1;overflow-y:auto}
.day{padding:10px 16px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.m{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:11px 14px 11px 12px;border-left:3px solid transparent;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.m:hover{background:var(--hover)}
.m.open{background:var(--brand2);border-left-color:var(--brand)}
.m.unread{border-left-color:var(--brand)}
.m .body{min-width:0;display:flex;flex-direction:column;gap:2px}
.m .r1{display:flex;gap:8px;align-items:baseline}
.m .who{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.m.unread .who,.m.unread .sub{font-weight:800}
.m .time{font-size:12px;color:var(--muted);white-space:nowrap}
.m.unread .time{color:var(--brandfg);font-weight:700}
.m .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.m .pre{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;color:var(--muted)}
.m .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;align-items:center}
.qa{position:absolute;right:10px;top:8px;display:none;gap:2px;background:var(--pane);border:1px solid var(--line);border-radius:10px;padding:2px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.m:hover .qa{display:flex}
.qa button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:14px}
.qa button:hover{background:var(--hover)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.t-new{background:var(--bluebg);color:var(--blue)}.t-asg{background:var(--pane2);color:var(--muted);border:1px solid var(--line)}
.t-prom{background:var(--amberbg);color:var(--amber)}.t-late{background:var(--redbg);color:var(--red)}.t-done{background:var(--greenbg);color:var(--green)}
.t-xfer{background:var(--violetbg);color:var(--violet)}.t-flag{color:var(--red);font-size:13px}
.empty{padding:60px 24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{font-size:16px;color:var(--fg)}

/* reader */
.read{flex:1;min-width:0;background:var(--pane);display:flex;flex-direction:column;min-height:0}
.rtop{padding:16px 22px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.rtop h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.25;text-wrap:balance}
.rtitle{display:flex;gap:10px;align-items:flex-start}
.rtitle h1{flex:1;min-width:0}
.back{display:none;width:34px;height:34px;border-radius:10px;background:var(--pane2);flex:none}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;font-weight:600;font-size:13px;background:var(--pane2);border:1px solid var(--line)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.vio{background:var(--violetbg);color:var(--violet);border-color:transparent}
.btn.ok{background:var(--greenbg);color:var(--green);border-color:transparent}
.track{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--pane2);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:13px}
.track .k{color:var(--muted);font-size:12px;font-weight:600}
.track select{background:var(--pane);border:1px solid var(--line);border-radius:8px;padding:4px 8px;max-width:190px}
.track .sp{width:1px;height:20px;background:var(--line)}
.rbody{position:relative;flex:1;overflow-y:auto;padding:16px 22px 24px;display:flex;flex-direction:column;gap:0}
.promise{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--amberbg);border-radius:var(--r);padding:10px 12px}
.promise.late{background:var(--redbg)}
.promise b{flex:1 1 200px;min-width:0}
.promise .sub{font-size:12px;color:var(--muted)}
/* STEP 5: no cards - a thin header, a flowing body, a faint divider */
.mail{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 2px;display:flex;flex-direction:column;gap:10px;background:transparent}
.mail header{display:flex;gap:10px;align-items:center}
.mail header .w{flex:1;min-width:0}
.mail header .w b{display:block}
.mail header .w span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.mail header time{font-size:12px;color:var(--muted);white-space:nowrap}
.mail p{margin:0;white-space:pre-wrap;line-height:1.6}
.att{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;width:fit-content}
.inline{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.inline .to{padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.inline textarea{border:0;outline:none;resize:vertical;min-height:90px;padding:10px 12px;background:var(--pane);line-height:1.5}
.inline footer{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--pane2);border-top:1px solid var(--line)}
.inline footer .grow{flex:1}
.inline input[type=text],.inline input[type=date]{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--pane);min-width:0}
.hist{display:flex;flex-direction:column;gap:0;padding-left:6px}
.hist h5{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.hi{display:flex;gap:10px;font-size:12.5px;padding-bottom:10px;position:relative}
.hi::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--line);margin-top:4px;flex:none;box-shadow:0 0 0 3px var(--pane)}
.hi.h-r::before{background:var(--brand)}.hi.h-x::before{background:var(--violet)}.hi.h-a::before{background:var(--blue)}.hi.h-d::before{background:var(--green)}.hi.h-p::before{background:var(--amber)}
.hi span{color:var(--muted)}
.hi>div{min-width:0;flex:1;overflow-wrap:anywhere}
.rbody>*,.page>*,.folders>*,.dlg .body>*{flex-shrink:0}
.blank{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}
.blank img{height:56px;opacity:.9;margin:0 auto 12px;display:block;border-radius:10px}

/* pages (people, tasks, etc.) */
.page{flex:1;min-width:0;overflow-y:auto;background:var(--pane);padding:22px clamp(16px,3vw,32px) 40px;display:flex;flex-direction:column;gap:18px}
.page h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.page .lead{color:var(--muted);margin:-10px 0 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--pane)}
.card h3{margin:0;font-size:14px;display:flex;align-items:center;gap:8px}
.person{display:flex;gap:10px;align-items:center}
.person .w{flex:1;min-width:0}
.person .w b{display:block;font-size:13.5px}
.person .w span{font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.task .w{min-width:0}
.task .w b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .w span{font-size:12px;color:var(--muted)}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line)}
.tick:hover{border-color:var(--green);background:var(--greenbg)}
.feed{display:flex;flex-direction:column;gap:10px;max-width:760px}
.post{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.post span{font-size:12px;color:var(--muted)}
.post p{margin:0}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(10,8,6,.45);display:grid;place-items:center;z-index:50;padding:16px;backdrop-filter:blur(3px)}
.dlg{background:var(--pane);border-radius:18px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100% - 24px);display:flex;flex-direction:column;overflow:hidden}
.dlg.wide{width:min(760px,100%)}
.dlg header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg header h3{margin:0;font-size:16px;flex:1}
.dlg .body{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{width:32px;height:32px;border-radius:10px;background:var(--pane2)}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12px;font-weight:700;color:var(--muted)}
.dlg input[type=text],.dlg input[type=email],.dlg input[type=date],.dlg select,.dlg textarea{border:1px solid var(--line);background:var(--pane2);border-radius:10px;padding:8px 10px;width:100%;box-sizing:border-box;min-width:0}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dpick{border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px}
.dpick[aria-pressed="true"]{border-color:var(--violet);background:var(--violetbg)}
.dpick span{font-size:11.5px;color:var(--muted)}
.ai{display:flex;gap:6px}
.ai input{flex:1}
.editor{border:1px solid var(--line);border-radius:12px;min-height:170px;padding:10px 12px;line-height:1.55;outline:none;background:var(--pane)}
.pop{position:fixed;top:58px;right:12px;width:min(370px,calc(100% - 24px));background:var(--pane);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:40;max-height:72%;display:flex;flex-direction:column;overflow:hidden}
.pop header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.pop ul{list-style:none;margin:0;padding:0;overflow:auto}
.pop li{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;font-size:13px}
.pop li.un{background:var(--brand2)}
.pop li small{color:var(--muted)}
.menu button{display:flex;gap:10px;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
.menu button:hover{background:var(--hover)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--pane);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:60;box-shadow:var(--shadow);margin-bottom:env(safe-area-inset-bottom,0px)}
.mobnav{display:none}
[hidden]{display:none!important}

/* signature block */
.sig{border-left:3px solid var(--line);padding:4px 0 4px 12px;font-size:12.5px;color:var(--muted);white-space:pre-wrap;line-height:1.5}
.sig.ours{border-left-color:var(--brand)}
.sig small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:2px}
.via{display:inline-block;font-size:11px;font-weight:700;background:var(--brand2);color:var(--brandfg);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
/* dashboard */
.mbx{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#fff;background:#ffffff14;border:1px solid #ffffff22;border-radius:999px;padding:5px 10px;white-space:nowrap}
.mbx span{font-weight:500;opacity:.75}
@media (max-width:1100px){.mbx{display:none}}
body.signedout>header,body.signedout>.shell,body.signedout>.mobnav,body.signedout>.fab{visibility:hidden}

function cleanHTML(html){const d=new DOMParser().parseFromString('<div>'+html+'</div>','text/html');

 d.querySelectorAll('*').forEach(n=>{[...n.attributes].forEach(a=>{const v=a.value.trim().toLowerCase();if(a.name.startsWith('on')||((a.name==='href'||a.name==='src')&&v.startsWith('javascript:'))||(n.tagName==='IMG'&&a.name==='src'&&!v.startsWith('data:image/')&&!v.startsWith('https:')))n.removeAttribute(a.name)});if(n.tagName==='A'){n.setAttribute('target','_blank');n.setAttribute('rel','noopener')}});
 return d.body.firstChild.innerHTML}

const ADR_RX=/[\w.+'-]+@[\w-]+(\.[\w-]+)+/g;
function allCc(t){const own=new Set([String(t.email||'').toLowerCase()]),out=[];
 (t.msgs||[]).forEach(m=>[m.email,...String(m.to||'').match(ADR_RX)||[],...String(m.cc||'').match(ADR_RX)||[]].forEach(e=>{e=String(e||'').toLowerCase();if(!e||own.has(e)||e.endsWith('@'+DOMAIN))return;own.add(e);out.push(e)}));
 return out.join(', ')}
function adrBook(){const map=new Map(),add=(email,name,sub)=>{email=String(email||'').trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(email))return;const c=map.get(email);if(c){c.n++;if(!c.name&&name)c.name=name;return}map.set(email,{email,name:name||'',sub:sub||'',n:1})};
 try{contacts().forEach(c=>add(c.email,c.name,c.company||''))}catch(e){}
 PEOPLE.filter(p=>p.active!==false).forEach(p=>add(p.login,p.name,'Rugs Creation'));
 S.threads.forEach(t=>t.msgs.forEach(m=>{add(m.email,m.ours?'':m.from,'');[String(m.to||''),String(m.cc||'')].forEach(x=>x.split(/[,;]/).forEach(part=>{const e=(part.match(ADR_RX)||[])[0];if(e)add(e,part.replace(/<.*$/,'').replace(/["']/g,'').trim(),'')}))}));
 return[...map.values()].sort((a,b)=>b.n-a.n)}
function adrSuggest(inp){if(!inp)return;const box=document.createElement('ul');box.className='adrs';box.hidden=true;box.setAttribute('role','listbox');inp.parentNode.appendChild(box);

 const tok=()=>{const v=inp.value,i=Math.max(v.lastIndexOf(','),v.lastIndexOf(';'));return{head:i<0?'':v.slice(0,i+1)+' ',q:v.slice(i+1).trim().toLowerCase()}};
 const close=()=>{box.hidden=true;box.innerHTML='';items=[]};
 const pick=i=>{const c=items[i];if(!c)return;const{head}=tok();inp.value=(head+c.email+', ').replace(/^\s+/,'');close();inp.focus()};
 const draw=()=>{box.innerHTML=items.map((c,i)=>`<li role="option" data-i="${i}" class="${i===ix?'on':''}"><b>${esc(c.name||c.email)}</b><span>${esc(c.name?c.email:'')}${c.sub?' · '+esc(c.sub):''}</span></li>`).join('');box.hidden=!items.length};
 inp.addEventListener('input',()=>{const{q}=tok();if(q.length<1){close();return}book=book||adrBook();const used=new Set((inp.value.match(ADR_RX)||[]).map(x=>x.toLowerCase()));
  items=book.filter(c=>!used.has(c.email)&&(c.email.includes(q)||c.name.toLowerCase().split(/\s+/).some(w=>w.startsWith(q))||(c.name.toLowerCase().includes(q)&&q.length>2))).slice(0,8);ix=0;draw()});
 inp.addEventListener('keydown',e=>{if(box.hidden)return;if(e.key==='ArrowDown'){e.preventDefault();ix=(ix+1)%items.length;draw()}else if(e.key==='ArrowUp'){e.preventDefault();ix=(ix-1+items.length)%items.length;draw()}else if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();pick(ix)}else if(e.key==='Escape'){e.stopPropagation();close()}});
 box.addEventListener('mousedown',e=>{const li=e.target.closest('li[data-i]');if(li){e.preventDefault();pick(+li.dataset.i)}});

/* 17 Nov 2026: a forward carries the original mail's files. They are not on the device -
   only their names, types and sizes are - so a ticked file is fetched from Gmail through the
   same `attachment` action the preview uses, and then becomes an ordinary attachment of the
   new mail (same cards, same 15 MB check). Tiny inline pictures (logos in a signature) are
   left out, as everywhere else in the app. */
function origAtts(t){const out=[];
 (t&&t.msgs||[]).forEach((m,mi)=>{if(!m||!m.gid)return;
  const seen=new Set();
  (m.atts||[]).forEach(a=>{if(!a||!a.name)return;
   if(/^image\//i.test(a.mime||'')&&(a.size||0)<40000)return;
   seen.add(a.name);out.push({name:a.name,size:a.size||0,mime:a.mime||'',gid:m.gid,mi,who:m.from||m.email||'',at:m.at})});
  (m.files||[]).forEach(f=>{if(!f||!f.name||seen.has(f.name))return;
   out.push({name:f.name,size:f.size||0,mime:'',gid:m.gid,mi,who:m.from||m.email||'',at:m.at})})});
 return out}
/* 17 Nov 2026: Forward as attachment (Outlook style). The mail is written out as a real
   .eml file (message/rfc822) and attached, so the person receiving it gets the original mail
   as an item they can open, with its own From / To / Date / Subject, instead of quoted text.
   Note: the original's own attachments are NOT inside this .eml - Rugs Email keeps only their
   names on the device, not the bytes - so they are named in a warning instead. */
const eml2047=s=>/[^\x20-\x7e]/.test(String(s||''))?'=?UTF-8?B?'+btoa(unescape(encodeURIComponent(String(s))))+'?=':String(s||'');
const emlDate=at=>new Date(at||Date.now()).toUTCString().replace(/GMT$/,'+0000');
function emlText(t,m){
 const sub=cleanSub(t.sub)||'(no subject)';
 const from=(m.from?eml2047(m.from)+' ':'')+'<'+String(m.email||'').replace(/[<>\r\n]/g,'')+'>';
 const to=String(m.to||(m.by?t.email:mailOf(dept(t.dept)))||'').replace(/[\r\n]/g,' ');
 const body=m.html||('<div style="font-family:Calibri,Arial,sans-serif;font-size:15px">'+esc(String(m.body||'')).replace(/\n/g,'<br>')+'</div>');
 const atts=(m.atts||[]).map(a=>a&&a.name).filter(Boolean);
 let s='From: '+from+'\r\nTo: '+to+'\r\n';
 if(m.cc)s+='Cc: '+String(m.cc).replace(/[\r\n]/g,' ')+'\r\n';
 s+='Date: '+emlDate(m.at)+'\r\nSubject: '+eml2047(sub)+'\r\n';
 if(atts.length)s+='X-Original-Attachments: '+eml2047(atts.join(', ')).replace(/[\r\n]/g,' ')+'\r\n';
 s+='X-Forwarded-By: Rugs Email\r\nMIME-Version: 1.0\r\nContent-Type: text/html; charset="UTF-8"\r\nContent-Transfer-Encoding: base64\r\n\r\n';
 s+=btoa(unescape(encodeURIComponent(body))).replace(/(.{76})/g,'$1\r\n');
 return s}
function fwdAsAtt(t){
 if(!t||!(t.msgs||[]).length){toast('Nothing to forward yet');return}
 const m=t.msgs[t.msgs.length-1];
 let f;
 try{const name=((cleanSub(t.sub)||'mail').replace(/[\\/:*?"<>|]+/g,' ').trim().slice(0,60)||'mail')+'.eml';
  f=new File([emlText(t,m)],name,{type:'message/rfc822'})}

 compose({t,fwd:true,asAtt:true,to:'',sub:'Fwd: '+(cleanSub(t.sub)||'(no subject)'),files:[f]});

 if(miss.length)setTimeout(()=>toast('The mail itself is attached. Its own '+miss.length+' file'+(miss.length>1?'s':'')+' ('+miss.slice(0,2).join(', ')+(miss.length>2?'…':'')+') are not inside it - attach them separately if they are needed.'),900)}
/* 28 Nov 2026: who a reply goes to. If the conversation's other side is our own mailbox
   (we wrote the last mail), reply to the newest real other party - like Outlook. */
function replyTo(t){try{const box=String(t.box||mailOf(dept(t.dept))||'').toLowerCase(),em=String(t.email||'').toLowerCase();
 if(em&&em!==box)return t.email;

 for(let i=ms.length-1;i>=0;i--){const m=ms[i];if(!m)continue;
  if(m.ours||m.by){const a=(String(m.to||'').match(/[^\s<>,;"']+@[^\s<>,;"']+/g)||[]).filter(x=>x.toLowerCase()!==box);if(a.length)return [...new Set(a.map(x=>x.toLowerCase()))].join(', ')}

const REMOTE_RE=/\b(?:src|background|poster|srcset)\s*=\s*["']?\s*(?:https?:)?\/\/|url\(\s*["']?\s*(?:https?:)?\/\//i;
const PIC_CSP='<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; img-src data: blob: cid:; style-src \'unsafe-inline\'; font-src data:; media-src data: blob:">';

/* Nov 2026: a link inside a received mail's own HTML (shown in the sandboxed
   "exactly as received" iframe) must always open as a real new browser tab,
   not try to navigate that tiny iframe in place - <base target="_blank">
   does this for every link regardless of whether the sender's own HTML set
   one, and the iframe's "allow-popups-to-escape-sandbox" lets it actually
   become a top-level tab. This runs for every raw mail, not just ones with
   blocked pictures - picHTML used to return early (unchanged) whenever
   there was nothing to block, which skipped it entirely. */
function picHTML(m,h){const BASE='<base target="_blank">';
 const block=!picsOk(m)&&hasRemote(h),inj=BASE+(block?PIC_CSP:'')+'<style>img{max-width:100%;height:auto}body{overflow-wrap:anywhere}</style>'/*__design13*/;

/* 19 Nov 2026: a picture that has not arrived yet is an rmcid: link, which the browser draws as a
   broken-image icon - that is what "the signature is not showing" looked like. Until it arrives it
   is drawn as blank space (the mail keeps its own size and layout), and a picture written in the
   text as [cid:...] shows a small "picture loading" line instead of raw [rmcid:...] text.
   Display only: the links stay in the mail itself, so cidPaint still finds them. */
const PIXEL="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
/* 19 Nov 2026: a picture that has arrived is put into the mail ALREADY ON THE SCREEN - the tag that
   was waiting for it is given its real src where it stands (inside the sandboxed frame too), and a
   picture that was written in the text becomes a real <img>. Nothing is rebuilt, so the mail does not
   flicker and does not jump back to the top; the frame is re-measured so the mail still grows to fit. */
function cidLive(){
 let any=false;
 const fill=(doc)=>{let hit=false;
  doc.querySelectorAll('img[data-rmcid],span[data-rmcid]').forEach(el=>{
   const k=el.getAttribute('data-rmcid'),d=k&&CIDD[k];if(!d)return;
   if(el.tagName==='IMG'){el.setAttribute('src',d);el.removeAttribute('data-rmcid');el.style.display='';hit=true}
   else{const im=doc.createElement('img');im.setAttribute('src',d);im.alt='';im.style.maxWidth='100%';im.style.height='auto';
    if(el.parentNode)el.parentNode.replaceChild(im,el);hit=true}});
  return hit};
 try{if(fill(document))any=true}catch(e){}
 document.querySelectorAll('.raw iframe').forEach(f=>{try{const d=f.contentDocument;if(d&&fill(d))any=true}catch(e){}});
 if(any)try{setTimeout(fitFrames,60)}catch(e){}
 return any}

  .replace(CID_TXT,(m0,pre,k)=>pre+'<span data-rmcid="'+k+'" style="color:#9c948e;font-size:12px">⏳ picture loading…</span>')}

   reached about four times less far down the Inbox, so mail people expected to see fell
   outside it and looked missing (while still showing in the much shorter My work list).
   The ceiling GROWS with the window (cap x CAP_ROW_PER), so one enormous mailbox cannot
   stall a slow PC while 'scroll for more' always keeps making progress - a fixed ceiling
   stopped the pager dead as soon as it was reached. */

   it were hiding most of itself ("Items: 46,264"). These numbers always meant
   conversations - a row simply used to be one. */

 let perMail=false;for(let i=0;i<rows.length&&i<40;i++){if(rows[i]&&rows[i]._one){perMail=true;break}}

 return seen.size}

 let perMail=false;for(let i=0;i<rows.length&&i<40;i++){if(rows[i]&&rows[i]._one){perMail=true;break}}

const FREE_MAIL=/^(gmail|googlemail|yahoo|ymail|hotmail|outlook|live|msn|aol|icloud|me|proton|protonmail|rediffmail|zoho|mail|gmx|yandex)\./i;
function b4dom(e){return String(e||'').toLowerCase().split('@')[1]||''}
function b4lev(a,b){if(a===b)return 0;if(Math.abs(a.length-b.length)>2)return 9;const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}return m[a.length][b.length]}
let B4K=null,B4KAt=0;
function b4known(){if(B4K&&Date.now()-B4KAt<60000)return B4K;const c={};S.threads.forEach(t=>t.msgs.forEach(m=>{const d=b4dom(m.email);if(d&&!FREE_MAIL.test(d))c[d]=(c[d]||0)+1}));
 const names={};S.threads.forEach(t=>t.msgs.forEach(m=>{const d=b4dom(m.email),n=String(m.from||'').trim().toLowerCase();if(n&&d&&!FREE_MAIL.test(d))(names[n]=names[n]||new Set()).add(d)}));
 B4K={doms:Object.keys(c).filter(d=>c[d]>=3).concat([DOMAIN]),names};B4KAt=Date.now();return B4K}
/* returns a list of reasons this mail may not be from who it says */
function spoofCheck(m){if(!m||m.ours||m.by)return[];const em=String(m.email||'').toLowerCase(),d=b4dom(em),name=String(m.from||'').trim().toLowerCase(),out=[];if(!d)return out;
 const K=b4known(),root=x=>x.replace(/\.(com|co|in|net|org|de|uk|us|eu|co\.uk|com\.au)$/,'');
 if(d!==DOMAIN&&!K.doms.includes(d)){const near=K.doms.find(k=>k!==d&&(b4lev(root(k),root(d))<=2&&root(k).length>4||root(d).replace(/[^a-z]/g,'')===root(k).replace(/[^a-z]/g,'')));if(near)out.push(`The address <b>${esc(d)}</b> looks like <b>${esc(near)}</b> but is different — a common trick.`)}
 if(d!==DOMAIN&&/rugs\s*creation|rugscreation/.test(name))out.push(`The name says Rugs Creation but the mail came from outside (<b>${esc(d)}</b>).`);
 if(d!==DOMAIN&&PEOPLE.some(p=>p.name&&p.name.length>3&&name===p.name.toLowerCase()))out.push(`The name matches a colleague, but the address is not @${DOMAIN}.`);
 if(FREE_MAIL.test(d)&&K.names[name]&&K.names[name].size)out.push(`${esc(m.from)} usually writes from <b>${esc([...K.names[name]][0])}</b>, this time from a free <b>${esc(d)}</b> address.`);
 const body=String(m.body||'').toLowerCase();if(/(bank|account|iban|swift|beneficiary|payment)[^.\n]{0,60}(changed|change|new|updated|update)|(changed|new|updated)[^.\n]{0,40}(bank|account details|iban|beneficiary)/.test(body)&&d!==DOMAIN)out.push('It asks to <b>change bank / payment details</b>. Always confirm by phone on a number you already have before paying.');
 return out}

function contactCard(email){email=String(email||'').toLowerCase();const c=contacts().find(x=>x.email.toLowerCase()===email)||{email,name:email.split('@')[0],mails:0,depts:[],owners:[]};
 const ths=S.threads.filter(t=>t.msgs.some(m=>String(m.email).toLowerCase()===email)).sort((a,b)=>b.msgs[b.msgs.length-1].at-a.msgs[a.msgs.length-1].at);
 const open=ths.filter(t=>st(t)!=='done'),late=ths.filter(t=>st(t)==='late'),d=b4dom(email),same=d&&!FREE_MAIL.test(d)?contacts().filter(x=>b4dom(x.email)===d&&x.email.toLowerCase()!==email).slice(0,8):[];

function b4utc(d){return d.getUTCFullYear()+b4pad(d.getUTCMonth()+1)+b4pad(d.getUTCDate())+'T'+b4pad(d.getUTCHours())+b4pad(d.getUTCMinutes())+'00Z'}
function calDlg(t){const now=new Date(Date.now()+86400000);now.setMinutes(0);const ds=now.getFullYear()+'-'+b4pad(now.getMonth()+1)+'-'+b4pad(now.getDate());

 L.querySelector('[data-ics]').onclick=()=>{const x=v();if(!x)return;const e=s=>String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');const me=who(ME);
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rugs Creation//Rugs Email//EN','METHOD:REQUEST','BEGIN:VEVENT','UID:'+Date.now()+'@rugscreation.com','DTSTAMP:'+b4utc(new Date()),'DTSTART:'+b4utc(x.st0),'DTEND:'+b4utc(x.en),'SUMMARY:'+e(x.T),'DESCRIPTION:'+e(x.N),x.W?'LOCATION:'+e(x.W):'','ORGANIZER;CN='+e(me?.name||'Rugs Creation')+':mailto:'+mailOf(dept(t.dept)),...x.G.split(/[,;]\s*/).filter(g=>/@/.test(g)).map(g=>'ATTENDEE;RSVP=TRUE:mailto:'+g.trim()),'END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download=(x.T.replace(/[^\w ]+/g,'').slice(0,40)||'invite')+'.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);b4log(t,'📅 Calendar invite (.ics) made: '+x.T);toast('Invite downloaded — attach it to a mail or open it in Outlook')}}

function deskNotify(fresh){if(!deskOn()||!fresh||!fresh.length)return;if(!document.hidden&&document.hasFocus())return;
 const mine=fresh.filter(t=>!t.owner||t.owner===ME).slice(0,3);(mine.length?mine:fresh.slice(0,1)).forEach(t=>{const m=t.msgs[t.msgs.length-1]||{},warn=spoofCheck(m).length,crit=critOf(t).length;

   n.onclick=()=>{try{window.focus();parent&&parent.focus()}catch(e){}app='mail';openId=t.id;render();n.close()}}catch(e){}});
 if(fresh.length>3)try{new Notification('Rugs Email',{body:fresh.length+' new mails',icon:LOGO,tag:'rm-many'})}catch(e){}}

/* ---------- wiring into the reading pane ---------- */
const _rrZ=renderRead;
renderRead=function(){_rrZ();const t=openId&&T_(openId),bar=document.querySelector('#read .xacts');if(!t)return;
 if(bar&&!bar.querySelector('[data-b4task]')){bar.insertAdjacentHTML('beforeend',`<button class="btn" data-b4ct="${esc(t.email)}">👤 Contact card</button><button class="btn" data-b4cal="${t.id}">📅 Invite</button><button class="btn" data-b4task="${t.id}">✅ Make task</button>`)}
 if(isPrivate(t))return;const m=[...t.msgs].reverse().find(x=>!x.ours&&!x.by),why=spoofCheck(m);
 const rb=document.querySelector('#read .rbody');if(why.length&&rb&&!rb.querySelector('.b4warn'))rb.insertAdjacentHTML('afterbegin',`<div class="b4warn" role="alert"><b>⚠ Be careful — this mail may not be from who it says</b><ul>${why.map(w=>`<li>${w}</li>`).join('')}</ul><small>Don’t open attachments, click links or pay until you have checked with the sender on a phone number you already have.</small></div>`);
 document.querySelectorAll('#read article.mail header .w b').forEach((b)=>{const art=b.closest('article.mail'),i=art?+art.id.slice(art.id.lastIndexOf('-')+1):-1;const mm=t.msgs[i];if(!mm||mm.ours||b.dataset.b4)return;b.dataset.b4='1';b.classList.add('b4name');b.title='Open contact card';b.addEventListener('click',e=>{e.stopPropagation();contactCard(mm.email)})})};
document.addEventListener('click',e=>{const b=e.target.closest('[data-b4ct],[data-b4cal],[data-b4task],[data-b4go],[data-b4copy]');if(!b)return;

 if(b.dataset.b4task){const t=T_(b.dataset.b4task);if(t)taskDlg(t);return}
 if(b.dataset.b4go){const t=T_(b.dataset.b4go);$('#layer').innerHTML='';app='mail';if(t&&!inView(t)){view={type:'box',dept:t.dept,folder:t.folder==='inbox'?'inbox':t.folder};lfilt='';filt='all';$('#q').value=''}open(b.dataset.b4go);return}

<script>
/* ===================== 17 Nov 2026: the Sent folder is personal too =====================
   A shared team mailbox (teamalpha@, teampulse@ ...) has ONE Sent folder on Google's side,
   so everybody used to see everybody's sent mail in it. Now a team member sees in Sent only
   the mail HE sent, the same way the Inbox already works (seeMine). The team's manager, the
   CRM and the admin still see everything the mailbox sent.
   "Mine" means: sent from Rugs Email by me, or sent from Outlook / Gmail under my own name,
   or sent from one of my own addresses (my user id plus the aliases in Admin -> Users).
   A mail sent from the mailbox under a name that belongs to nobody (e.g. "team alpha") cannot
   be traced to a person, so it stays visible to the whole team - nothing goes missing.
   This is the LAST layer over inView on purpose; an earlier layer would be bypassed. */
/* __sendersuffix 28 Nov 2026: "Arun – Rugs Creation", "Ashok | Team Pulse", "Arun (Rugs Creation)" -> "Arun" */
function cleanSender(x){const raw=String(x||'');
 let s=raw.split(/\s+[\u2013\u2014\-|]\s*|\s*\|\s*|\s*\(/)[0];
 s=s.replace(/\brugs?\s*creations?\b/ig,' ').replace(/\bteam\s*(pulse|alpha)\b/ig,' ').replace(/\s+/g,' ').trim();
 return s}
function nmKey(s){return String(s||'').toLowerCase().replace(/[^a-z\s]+/g,' ').trim().split(/\s+/)
 .filter(Boolean).map(w=>{const y=w.replace(/(.)\1+/g,'$1');return y[0]+y.slice(1).replace(/[aeiou]/g,'')})
 .filter(Boolean)}                      /* Jagjeet = Jagjit, Gulaab = Gulab, GULAB TYAGI = Gulab Tyagi */
function sentWho(m,t){                   /* which person sent this message, or null if we cannot tell */
 if(!m)return null;
 if(m.by)return m.by;                    /* sent from Rugs Email */
 if(!m.ours)return null;                 /* came from outside */
 const e=String(m.email||'').toLowerCase();
 if(e){const byMail=PEOPLE.find(p=>p.active!==false&&(String(p.login||'').toLowerCase()===e||
   String((p.perm&&p.perm.aliases)||'').toLowerCase().split(/[\s,;]+/).includes(e)));
  if(byMail)return byMail.id}
 const k=nmKey(cleanSender(m.fname||m.from));if(!k.length)return null;
 const pool=PEOPLE.filter(p=>p.active!==false&&(!t||!t.dept||p.dept===t.dept));
 let hit=pool.filter(p=>nmKey(p.name).join(' ')===k.join(' '));
 if(hit.length===1)return hit[0].id;
 if(k.length===1){hit=pool.filter(p=>nmKey(p.name)[0]===k[0]);if(hit.length===1)return hit[0].id}
 if(k.length>1){hit=PEOPLE.filter(p=>p.active!==false&&nmKey(p.name).join(' ')===k.join(' '));
  if(hit.length===1)return hit[0].id}        /* a full name from another team (someone with access to this mailbox) */
 return null}
function msgMine(m,t){return !!m&&(m.by?m.by===ME:sentWho(m,t)===ME)}
function sentSeen(t){const p=who(ME);
 if(!p||!t)return true;
 if(p.role==='Admin'||['Manager','Lead','CRM'].includes(p.role))return true;
 const out=(t.msgs||[]).filter(m=>sentByUs(m,t));   /* __sentmine */
 if(!out.length)return true;             /* nothing was sent from this mailbox */
 if(out.some(m=>msgMine(m,t)))return true;  /* I sent one of them */
 return !out.some(m=>sentWho(m,t))}      /* nobody can be named: leave it with the whole team */
const _ivSent=inView;inView=function(t){
 if(t&&view&&view.type==='box'&&view.folder==='sent'&&t.dept===view.dept&&!sentSeen(t))return false;
 return _ivSent.apply(this,arguments)};
</script>
<script>/* __olpack:start */
/* Rugs Email - Outlook pack  (marker: __olpack)
   ---------------------------------------------------------------------------
   One extra layer on top of the mail app that lives in index.html as
   EMAIL_HTML_B64. It never edits the app's own code: it wraps rowHTML,

  /* =======================================================================
     5 - Unsubscribe
     ======================================================================= */
  const UNSUB_RX = /unsubscribe|opt[\s-]?out|stop these e?-?mails|manage (your )?(e?-?mail )?preferences/i;
  function unsubLink(t) {
    const ms = (t && t.msgs) || [];
    for (let i = ms.length - 1; i >= 0; i--) {
      const m = ms[i];
      if (!m || m.by || m.ours) continue;
      if (m.listUnsub && /^https?:/i.test(String(m.listUnsub))) return String(m.listUnsub);
      const html = String(m.raw || m.html || '');
      const rx = /<a\b[^>]*href\s*=\s*["']([^"']+)["'][^>]*>([\s\S]{0,300}?)<\/a>/gi;
      let a;
      while ((a = rx.exec(html))) {
        const href = a[1];
        const txt = String(a[2]).replace(/<[^>]*>/g, ' ');
        if (!/^https?:/i.test(href)) continue;
        if (UNSUB_RX.test(txt) || UNSUB_RX.test(href)) return href;
      }
      const u = String(m.body || '').match(/https?:\/\/\S*(unsubscribe|optout|opt-out)\S*/i);
      if (u) return u[0];
    }
    return '';
  }

  /* =======================================================================
     6 - Download all attachments as one ZIP
     ======================================================================= */
  function attsOf(t) {
    /* 24 Nov 2026: real files only - the pictures the mail draws in its own text (signature
       logos, icons) are not attachments a person wants in the ZIP, and are not counted. */
    const out = [], seen = {};
    ((t && t.msgs) || []).forEach(m => {
      const list = typeof attSplit === 'function' ? attSplit(m).show : ((m && m.atts) || []);
      list.forEach(a => {
        if (!a || !a.name || !m.gid) return;
        const k = m.gid + '|' + a.name; if (seen[k]) return; seen[k] = 1;
        out.push({ name: a.name, gid: m.gid });
      });
    });
    return out;
  }
  function zipAll(t, btn) {
    const list = attsOf(t);
    if (!list.length) { toast('No attachments in this conversation'); return; }
    const was = btn ? btn.innerHTML : '';
    const say = s => { if (btn) btn.textContent = s; };
    if (btn) btn.disabled = true;
    const bad = [];
    const used = {};
    say('Getting the viewer...');
    loadJS(OFX.jszip).then(() => {
      const zip = new JSZip();
      let i = 0;
      const next = () => {
        if (i >= list.length) {
          if (!Object.keys(zip.files).length) throw new Error('None of the files could be fetched');
          say('Making the ZIP...');
          return zip.generateAsync({ type: 'blob' }).then(blob => {
            // 18 Nov 2026: the ZIP keeps the subject's own letters (Hindi, accents...) - only characters
            // Windows forbids are replaced - and goes through the app's one saveFile().
            const nm = fileName(String(cleanSub(t.sub) || 'attachments').slice(0, 60)) || 'attachments';
            saveFile(blob, nm + '.zip', 'application/zip');
            toast(bad.length ? 'ZIP saved - these could not be fetched: ' + bad.join(', ') : 'ZIP saved');
          });
        }
        const it = list[i++];
        say('Getting file ' + i + ' of ' + list.length + '...');
        return api('attachment', { mailbox: t.box, gmailId: it.gid, name: it.name })
          .then(r => {
            let nm = it.name || ('file' + i);
            if (used[nm]) {
              const d = nm.lastIndexOf('.');
              nm = d > 0 ? nm.slice(0, d) + ' (' + used[nm] + ')' + nm.slice(d) : nm + ' (' + used[nm] + ')';
            }
            used[it.name] = (used[it.name] || 0) + 1;
            zip.file(nm, r.b64 || '', { base64: true });
          })
          .catch(() => { bad.push(it.name); })
          .then(next);
      };
      return next();
    }).catch(e => {
      toast('Could not make the ZIP - ' + ((e && e.message) || 'try again'));
    }).then(() => {
      if (btn) { btn.disabled = false; btn.innerHTML = was; }
    });
  }

  /* =======================================================================
     7 - Read aloud
     ======================================================================= */
  let speaking = false;
  function readAloud(t, btn) {
    const synth = window.speechSynthesis;
    if (!synth) { toast('This browser cannot read mail aloud'); return; }
    if (speaking) { synth.cancel(); speaking = false; if (btn) btn.textContent = 'Read aloud'; return; }
    const ms = t.msgs || [];
    const last = ms[ms.length - 1];
    const body = String((last && last.body) || '').replace(/\s+/g, ' ').trim();
    const txt = (cleanSub(t.sub) || 'No subject') + '. From ' + (rowName(t) || 'unknown') + '. ' + (body || 'This mail has no text.');
    const u = new SpeechSynthesisUtterance(txt.slice(0, 7000));
    const voices = synth.getVoices() || [];
    const v = voices.filter(x => /en[-_]IN/i.test(x.lang))[0] || voices.filter(x => /^en/i.test(x.lang))[0];
    if (v) u.voice = v;
    u.onend = u.onerror = () => { speaking = false; if (btn) btn.textContent = 'Read aloud'; };
    speaking = true;
    if (btn) btn.textContent = 'Stop reading';
    synth.cancel(); synth.speak(u);
  }

/* read from the guard the app runs (server/patch-mem-cap-m1.js). If that block is not in
   the build, say so plainly rather than print a reassuring zero. */
function rMemNow() {
  try {
    const f = window.rzMemCap;
    if (typeof f !== 'function') return { mb: null, pc: null, hits: 0, live: false };
    const r = f() || {};
    const mb = (typeof r.nowMB === 'number') ? r.nowMB : null;
    return { mb: mb, pc: mb === null ? null : Math.round(mb / 250 * 100), hits: r.timesItHadToAct || 0, live: true, how: r.measured || '' };
  } catch (e) { return { mb: null, pc: null, hits: 0, live: false }; }
}

/* ======================================================= CONFLICT ENGINE === */
/* rChk(id,next) -> {hard:[],warn:[],eff:[]}
   hard = the change is refused and the reason is shown
   warn = it is allowed, and this is what it will cost
   eff  = what happens the moment it is applied, counted from the mail loaded here        */
function rChk(id, next) {
  const hard = [], warn = [], eff = [];
  const V = k => (k === id ? next : RV(k));
  const nMem = rMembers().length;

  if (id === 'R1') {
    if (next === false) {
      const n = rN(t => !t.owner);
      eff.push(rPlural(n, 'conversation') + ' nobody has taken would leave the Inbox of ' + rPlural(nMem, 'person', 'people') + ' and show only under "Needs owner".');
      const bad = rNoManager();
      if (bad.length) hard.push('In ' + bad.map(d => d.name).join(', ') + ' nobody would be looking after that mail: the team has no Manager and no Lead, so it would reach only the Admin. Give the team a Manager first, or leave this rule on.');
      if (V('R3') === false) warn.push('R3 is off, so members would see mail that belongs to a COLLEAGUE but not mail that belongs to NOBODY. That is the wrong way round and reads as a bug.');
      warn.push('Buyers wait longer: a first mail now sits until the manager hands it out.');
      warn.push('This is the exact change that produced four "my mail is missing" reports on 26 November.');
    } else {
      eff.push(rPlural(rN(t => !t.owner), 'conversation') + ' nobody has taken would appear in every team member\'s Inbox again.');
    }
  }

  if (id === 'R3') {
    if (next === false) {
      const n = rN(t => t.owner && t.owner !== ME);
      eff.push(rPlural(n, 'conversation') + ' that belong to somebody would become visible to everybody in the team.');
      hard.push('This is what was reported and reversed within the hour on 26 November ("now Ashok sees Arun\'s and Ashish\'s mail"). Five people share teampulse@, so every member would read every colleague\'s buyer correspondence.');
      warn.push('Every member\'s unread count becomes the whole mailbox\'s unread count.');
    } else {
      eff.push('Each member\'s Inbox goes back to their own work plus whatever nobody has taken.');
    }
  }

  if (id === 'R7') {
    if (next === false) {
      const n = rN(t => t.status === 'done'), all = rInbox().length;
      eff.push(rPlural(n, 'conversation') + ' of the ' + all + ' now in the Inbox are marked Done and would leave it at once' + (all ? ' (' + Math.round(n * 100 / all) + '% of what people can see)' : '') + '.');
      hard.push('43,296 conversations were marked Done in the 17 November sweep and the whole history of the newest mailboxes arrives Done. Switching this off empties most of the Inbox in one go, and that reads as lost mail to everybody.');
      warn.push('R20 stops being explainable: "1,062 in the Inbox, 11 in Needs owner" is only sensible while Done mail is still visible.');
      try { if (OLDMAIL.hide_before_live) warn.push('"Hide mail from before Go live" is ALSO ticked. Together those two leave almost nothing on screen.'); } catch (e) { }
    } else {
      eff.push(rPlural(rN(t => t.status === 'done'), 'Done conversation') + ' would come back into view in the Inbox.');
    }
  }

  if (id === 'R10' && next === false) {
    eff.push(rPlural(rN(t => typeof isOtp === 'function' && isOtp(t)), 'login-code mail') + ' is loaded here now; each would follow the ordinary rules instead of being shown to everyone.');
    if (V('R1') === false || V('R3') === true || rMgrList().length) {
      hard.push('A login code would reach nobody who needs it. With the rules as they are, a code sent to the team mailbox can sit behind "Needs owner" or inside a colleague\'s private conversation while the person is locked out of the account. Codes expire in minutes.');
    } else {
      warn.push('A code sent to a team mailbox could end up in a conversation somebody else owns.');
    }
    warn.push('Reported on 20 November as "OTP is not showing on email" - three separate rules were hiding them.');
  }
  if (id === 'R10' && next === true) eff.push('Login codes stay visible to everybody in the team and tagged, and still count as nobody\'s work.');

  if (id === 'R11') {
    const n = (() => { try { return rMine().filter(t => typeof isWsNotif === 'function' && isWsNotif(t)).length; } catch (e) { return 0; } })();
    if (next === false) {
      eff.push(rPlural(n, 'Workspace notification') + ' loaded here would move into the Inbox and start being counted as mail.');
      warn.push('Unread counts, Needs owner and the Home numbers all grow by machine-made mail that nobody ever answers.');
      warn.push('They were given their own folder on 14 November precisely because they were drowning the Inbox.');
    } else {
      eff.push(rPlural(n, 'notification') + ' goes back to the 🔔 Workspace notifications folder and out of every count.');
    }
  }

  if (id === 'R17') {
    const convs = rInbox().length;
    if (next === true) {
      let rows = 0; try { rInbox().forEach(t => { rows += Math.max(1, (t.msgs || []).length); }); } catch (e) { }
      eff.push('The list would build about ' + rows + ' rows instead of ' + convs + ' for the same mail, so every mail gets its own name and its own time.');
      warn.push('The browser does roughly four times as much work per draw and holds more in memory. The caps added on 26 November cover it, but an old i3 will feel it.');
      warn.push('This decision has been turned over three times in three days. Say which one you want and leave it alone for a day before judging it.');
    } else {
      eff.push('Back to one row per conversation (' + convs + ' rows), named after whoever wrote last.');
      warn.push('A mail like Aman Singh Verma\'s 25 November 17:34 then has no row of its own - its conversation shows "Manfred Mui, 8:21 pm".');
    }
  }

  if (id === 'R27') {
    if (next === true) {
      eff.push('From then on, answering mail nobody has taken puts your name on it and writes a history line.');
      hard.push('This is how Gulab\'s conversation silently became Jagjit\'s on 20 November. The app judges "nobody owns it" from the copy in THAT browser, so a page loaded before a colleague took the mail writes the replier over the real owner. The repair job for that incident is still the only record of who it belonged to.');
      if (V('R3')) warn.push('R3 is on, so the conversation would also leave every other member\'s Inbox the moment you answer it.');
    } else {
      eff.push('Replying goes back to making you a participant only - it stays in your Inbox and your My work, and the owner does not change.');
      warn.push('Mail somebody has answered can stay in Needs owner until a person actually takes it.');
    }
  }

  if (id === 'C5') {
    if (next === true) {
      const n = PEOPLE.filter(p => p.active !== false && p.role !== 'Admin' && !(p.perm && p.perm.transfer)).length;
      eff.push(rPlural(n, 'person', 'people') + ' who cannot transfer today would be able to move a conversation into another team.');

    } else {
      eff.push('Back to the per-person ticks in Admin -> Users, plus every Admin.');
    }
  }

  /* cross-checks that apply to any change */
  if (!rulesSaveable()) warn.push('The office server has not picked up the new setting yet, so this change cannot be saved for everybody. Wait for the server version to reach ' + RULES_SRV_NEED + ' and try again.');
  return { hard: hard, warn: warn, eff: eff };
}

  /* the list and the five counts must agree */
  try {
    const a = rInbox().filter(t => typeof isInboxMail === 'function' && isInboxMail(t)).length;
    const b = (typeof listRows === 'function') ? 0 : 0;
    if (a === 0 && rInbox().length > 0) out.push({ bad: true, t: 'The Inbox counts say zero while the Inbox has mail', d: 'Something is filtering the counts but not the list, or the other way round. Tell the terminal: "the counts and the list disagree".' });
  } catch (e) { }
  /* M1 (mandatory): this tab stays under 250 MB */
  try {
    const m = rMemNow();
    if (!m.live) out.push({ bad: true, t: 'Rule M1 cannot be checked on this page', d: 'The memory guard is not in this build, so nothing is holding the tab under 250 MB. Tell the terminal: "M1 is not running".' });
    else if (m.mb === null) out.push({ bad: false, t: 'Rule M1 is running, but this browser does not report the tab\'s memory', d: 'The ceiling is still enforced from what Rugs Email is holding. Chrome and Edge report the real figure.' });
    else if (m.mb > 250) out.push({ bad: true, t: 'This tab is over the 250 MB ceiling (' + m.mb + ' MB)', d: 'The guard is clearing copies now. If it stays over, reload the page and tell the terminal: "M1 is being breached".' });
    else if (m.pc >= 80) out.push({ bad: true, t: 'This tab is at ' + m.pc + '% of the 250 MB ceiling (' + m.mb + ' MB)', d: 'The page is clearing its copies early. Nothing is lost - a conversation it drops is fetched again when you open it.' });
    else out.push({ bad: false, t: 'Rule M1 is holding: ' + m.mb + ' MB of 250 MB (' + m.pc + '%)', d: 'Mandatory, with no switch. ' + (m.hits ? 'It has had to clear copies ' + rPlural(m.hits, 'time') + ' since this page was opened.' : 'It has not had to clear anything since this page was opened.') });
  } catch (e) { }
  if (!rulesSaveable()) out.push({ bad: false, t: 'The office server has not picked up the Mail rules setting yet', d: 'Until it does, a switch on this page cannot be saved for everybody. It updates itself within ten minutes of a push; look at Admin -> 🖥 Server for the version it is running.' });
  return out;
}

  const body = Object.assign({}, rulesObj(), { v: 1, vals: vals, log: log.slice(-200) });

/* ================================================= THE TWO WRAPPED RULES == */
/* R7 and R11 only ever REMOVE mail from a list, so a wrapper is enough - and a wrapper is
   safer here than editing the app, because both are read in several places and the list and
   the five Inbox counts have to agree. Both are applied to inView AND to isInboxMail. */
function rInboxView() { try { return view.type === 'all' || (view.type === 'box' && view.folder === 'inbox'); } catch (e) { return false; } }

/* R7 off: a conversation marked Done leaves the Inbox */
const _ivR7 = inView;
inView = function (t) { if (t && t.status === 'done' && !RON('R7') && rInboxView()) return false; return _ivR7.apply(this, arguments); };
const _imR7 = isInboxMail;
isInboxMail = function (t) { if (t && t.status === 'done' && !RON('R7')) return false; return _imR7.apply(this, arguments); };
const _lrR7 = listRows;
listRows = function () { const r = _lrR7.apply(this, arguments); return (RON('R7') || !rInboxView()) ? r : r.filter(t => !(t && t.status === 'done')); };

/* R11 off: Workspace notifications are ordinary mail again */
const _wsnR11 = isWsNotif;
isWsNotif = function (t) { return RON('R11') ? _wsnR11.apply(this, arguments) : false; };

const SIGNOFF=/^(?:(?:kind(?:est)?|best|warm(?:est)?|many|with|all|much)\s+)?(?:regards?|reg|wishes|thanks(?:\s+and\s+regards?)?|thank\s*you|rgds|brgds|b\.?r\.?|cheers|sincerely|respectfully|yours(?:\s+(?:sincerely|faithfully|truly))?|met\s+vriendelijke\s+groet(?:en)?|mit\s+freundlichen\s+gr(?:\u00fc|u)(?:\u00df|ss)en|freundliche\s+gr(?:\u00fc|u)(?:\u00df|ss)e|cordialement|bien\s+(?:\u00e0|a)\s+vous|salutations|saludos|atentamente|obrigad[oa]|grazie|merci|danke|gracias|looking\s+forward)$/i;
/* "Robin Vos | Loods 5" is how Loods 5 write their names: the bar is a separator, not markup. */
const _gnOld=goodName;
goodName=function(x){
 const v=String(x==null?'':x).trim();
 if(!v)return false;
 if(SIGNOFF.test(v.replace(/[,.!;:\u2013\u2014-]+$/,'').trim()))return false;   /* a sign-off is never a name */
 if(/[|\u00b7\u2022]/.test(v)&&!/[<>\[\]{}@]|https?:|cid:|www\./i.test(v))return _gnOld(v.replace(/\s*[|\u00b7\u2022]\s*/g,' '));
 return _gnOld(v)};
try{window.goodName=goodName}catch(e){}
/* who our own mails went to - memoised per conversation, so typing in the search box stays
   cheap on a mailbox holding thousands of conversations. */
function toCcOf(t){
 try{
  if(!t||!t.msgs)return '';
  const n=t.msgs.length;
  if(t._tcN===n&&typeof t._tc==='string')return t._tc;
  let s='',k=0;
  for(let i=n-1;i>=0&&k<6;i--){const m=t.msgs[i];if(!m||!(m.ours||m.by))continue;
   s+=' '+String(m.to||'').slice(0,300)+' '+String(m.cc||'').slice(0,300);k++}
  try{Object.defineProperty(t,'_tc',{value:s,writable:true,enumerable:false,configurable:true});
      Object.defineProperty(t,'_tcN',{value:n,writable:true,enumerable:false,configurable:true})}catch(e){t._tc=s;t._tcN=n}
  return s;
 }catch(e){return ''}}
try{window.toCcOf=toCcOf}catch(e){}
/* __signoff:end */</script>
