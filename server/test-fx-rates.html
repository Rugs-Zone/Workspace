<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>USD–INR Rates — test harness</title>
<!-- 24 Nov 2026: runs server/fx-rates.view.js exactly as index.html does, with the
     Workspace's own colour tokens and stand-ins for the handful of helpers it uses
     (esc, toast, opsTiles, opsPill, DIR_ICON, deskVisibleModules) and a stubbed fx-api.
     server/test-fx-rates.js drives this file in headless Edge. -->
<style>
  :root{--brand:#ff5001;--ink:#0f172a;--sub:#5f6570;--card:#fff;--line:#e6e8eb;--bg:#f5f6f8;--ok:#16a34a;--bad:#dc2626}
  *{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
  .btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer}
  .btn:not(.secondary){background:var(--brand);border-color:var(--brand);color:#fff}
  .btn[disabled]{opacity:.55;cursor:not-allowed}
  input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
  .page-head{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:0 0 10px}
  .page-sub,.sub{color:var(--sub)}
  .empty{padding:40px;text-align:center;color:var(--sub)}
  .ops-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:4px 0 14px}
  .ops-tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;font:inherit;color:var(--ink)}
  .ops-tile b{font-size:19px}.ops-tile span{color:var(--sub);font-size:12px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
  .tab.active{background:var(--brand);border-color:var(--brand);color:#fff}
  .ops-pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;background:#eef0f3;color:var(--sub)}
  h2,h3{margin:0}
</style></head>
<body>
<div id="view-fxrates">
  <div class="page-head"><h2>USD–INR Rates 💵</h2></div>
  <div class="page-sub" style="margin-top:-14px">Today's dollar rate in rupees, the week's and the month's high and low, and who gets the 10 AM email.</div>
  <div id="fxWrap"></div>
</div>
<script>
  /* ---- the bits of index.html the screen leans on ---- */
  var SUPABASE_URL = "https://example.invalid", ANON_KEY = "test-anon-key";
  var state = { doer: { session_token: "t0ken", email: "priya@rugscreation.com", is_admin: true, visible_modules: null }, demo: false, fx: null, fxRange: 30 };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
  window.__toasts = [];
  function toast(m) { window.__toasts.push(String(m)); }
  function opsTiles(list) {
    return '<div class="ops-tiles">' + list.map(function (t) {
      return '<button type="button" class="ops-tile' + (t.tone ? " t-" + t.tone : "") + '"><b>' + esc(t.v) + "</b><span>" + esc(t.l) + "</span></button>";
    }).join("") + "</div>";
  }
  function opsPill(text, tone) { return '<span class="ops-pill ops-' + (tone || "grey") + '">' + esc(text) + "</span>"; }
  var DIR_ICON = { wa: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/></svg>' };
  function deskVisibleModules() { return state.doer ? state.doer.visible_modules : null; }

  /* ---- the stubbed backend: the real fx-api shapes ---- */
  window.__calls = [];
  window.__fxData = null;                 /* set by the test before each case */
  window.__fxFail = null;                 /* {status, error} to make a call fail */
  window.fetch = function (url, init) {
    var body = {}; try { body = JSON.parse(init.body); } catch (e) {}
    window.__calls.push(body);
    if (window.__fxFail) {
      var f = window.__fxFail;
      return Promise.resolve({ ok: false, status: f.status, json: function () { return Promise.resolve({ ok: false, error: f.error }); } });
    }
    var out = { ok: true };
    if (body.action === "fxState") out = Object.assign({ ok: true }, window.__fxData);
    else if (body.action === "fxSendTest") out = { ok: true, queued: 1, subject: "USD–INR today" };
    return Promise.resolve({ ok: true, status: 200, json: function () { return Promise.resolve(out); } });
  };
  /* confirm() is a dialog in a headless browser - the test decides the answer */
  window.__confirmAnswer = true;
  window.confirm = function (m) { window.__confirmText = String(m); return window.__confirmAnswer; };
</script>
<script src="fx-rates.view.js"></script>
</body></html>
